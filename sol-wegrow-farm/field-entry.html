<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>現場登記 — 每日採收／花果抽樣／成熟追蹤</title>
<meta name="description" content="現場人員登記每日採收重量、花果抽樣與成熟追蹤，只記錄實際觀測，不填預估產量。">
<meta name="build-version" content="20261024T2-field-entry" data-testid="wegrow-build-stamp">
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --ink: #141713; --muted: #596258; --paper: #fbfaf4; --white: #ffffff;
    --line: #dfded4; --gold: #b68a35; --green: #153f2a; --mist: #eef1e8; --rose: #c84c41;
    --shadow: 0 24px 80px rgba(20, 23, 19, .13);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif; background:var(--paper); color:var(--ink); }
  button { cursor:pointer; font-family:inherit; }
  .hidden { display:none !important; }
  header.topbar { position: sticky; top:0; z-index:20; background: var(--white); border-bottom: 1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding: 12px 20px; }
  .brand-name { font-size:16px; font-weight:800; }
  .brand-sub { font-size:11px; color: var(--muted); }
  #logoutBtn { border:1px solid var(--line); background:var(--white); border-radius:999px; padding:6px 14px; font-size:12px; }

  main { max-width: 560px; margin: 0 auto; padding: 0 16px 90px; }

  #loginCard { max-width: 420px; margin: 60px auto; background: var(--white); border:1px solid var(--line); border-radius:12px; padding:28px 24px; box-shadow: var(--shadow); }
  #loginCard h2 { margin:0 0 6px; font-size:18px; }
  #loginCard p { font-size:13px; color: var(--muted); margin: 0 0 18px; }
  #loginCard label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  #loginCard input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); font-size:14px; margin-bottom:14px; }
  #loginCard button.primary { width:100%; background: var(--green); color:#fff; border:none; border-radius:8px; padding:12px; font-size:14px; font-weight:700; }
  .status { font-size:13px; margin:8px 0 0; }
  .status.error { color: var(--rose); }
  .status.success { color: var(--green); }

  .card { background:var(--white); border:1px solid var(--line); border-radius:12px; padding:16px; margin:14px 0; }
  .card h3 { margin:0 0 10px; font-size:15px; }
  .row { display:flex; gap:10px; margin-bottom:10px; }
  .row > * { flex:1; min-width:0; }
  label.field { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  select, input[type=number], input[type=date], input[type=text] {
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); font-size:14px; background:var(--white);
  }
  .stage-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  button.primary { background: var(--green); color:#fff; border:none; border-radius:8px; padding:11px; font-size:14px; font-weight:700; width:100%; }
  button.secondary { background: var(--white); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13px; }
  .tabs { display:flex; gap:8px; margin:14px 0 0; }
  .tabs button { flex:1; border:1px solid var(--line); background:var(--white); border-radius:999px; padding:8px; font-size:13px; }
  .tabs button.active { background: var(--green); color:#fff; border-color: var(--green); }
  .tracking-item { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
  .tracking-item .tag { font-weight:700; }
  .tracking-item .meta { color:var(--muted); font-size:12px; margin-top:2px; }
  .empty-note { color:var(--muted); font-size:13px; text-align:center; padding:20px 0; }
</style>
</head>
<body>

<div id="loginCard">
  <h2>現場登記</h2>
  <p>每日採收重量、花果抽樣與成熟追蹤——只記錄實際觀測到的數字，不用填預估產量。</p>
  <label>帳號</label>
  <input id="loginEmail" type="text" autocomplete="username">
  <label>密碼</label>
  <input id="loginPassword" type="password" autocomplete="current-password">
  <button class="primary" id="loginBtn">登入</button>
  <p class="status" id="loginStatus"></p>
</div>

<header class="topbar hidden" id="topbar">
  <div>
    <div class="brand-name">現場登記</div>
    <div class="brand-sub" id="userLabel"></div>
  </div>
  <button id="logoutBtn">登出</button>
</header>

<main class="hidden" id="mainArea">
  <div class="card">
    <h3>選擇農場與分區</h3>
    <div class="row">
      <div>
        <label class="field">農場</label>
        <select id="farmSelect"></select>
      </div>
      <div>
        <label class="field">分區</label>
        <select id="zoneSelect"></select>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button id="tabHarvestBtn" class="active">每日採收重量</button>
    <button id="tabSampleBtn">花果抽樣</button>
    <button id="tabTrackBtn">成熟追蹤</button>
  </div>

  <section id="harvestTab" class="card">
    <h3>每日採收重量</h3>
    <p style="font-size:12px; color:var(--muted); margin-top:-4px;">只登記這個分區今天實際採收的事實——沒有採收就按「確認零採收」，不要留空；如果是補登過去幾天累積的量，請勾選「補登」並填涵蓋天數，不要當成單日量。</p>
    <div class="row">
      <div>
        <label class="field">採收日期</label>
        <input type="date" id="harvestDate">
      </div>
      <div>
        <label class="field">商品重量（公斤）</label>
        <input type="number" id="harvestWeightKg" min="0" step="0.1" placeholder="例：3.5">
      </div>
    </div>
    <div class="row" style="align-items:center;">
      <label class="field" style="display:flex; align-items:center; gap:6px; margin:0;">
        <input type="checkbox" id="harvestConfirmedZero" style="width:auto;"> 確認零採收（今天真的沒採）
      </label>
    </div>
    <div class="row" style="align-items:center;">
      <label class="field" style="display:flex; align-items:center; gap:6px; margin:0;">
        <input type="checkbox" id="harvestIsCatchup" style="width:auto;"> 這是補登（累積過去幾天的量）
      </label>
    </div>
    <div class="row hidden" id="harvestCoverageRow">
      <div>
        <label class="field">涵蓋天數（例：3天沒登記、今天一次登記，填3）</label>
        <input type="number" id="harvestCoverageDays" min="2" step="1">
      </div>
    </div>
    <label class="field">備註（選填）</label>
    <input type="text" id="harvestNotes" placeholder="例：雨天延後採收">
    <div style="margin-top:12px;">
      <button class="primary" id="saveHarvestBtn">儲存採收記錄</button>
    </div>
    <p class="status" id="harvestStatus"></p>
  </section>

  <section id="sampleTab" class="card hidden">
    <h3>花果抽樣</h3>
    <div class="row">
      <div>
        <label class="field">抽樣日期</label>
        <input type="date" id="sampleDate">
      </div>
      <div>
        <label class="field">抽樣株數</label>
        <input type="number" id="samplePlantCount" min="1" step="1" placeholder="實際點數的株數">
      </div>
    </div>
    <label class="field">各階段顆數（只填實際點到的，沒有的留空）</label>
    <div class="stage-grid">
      <div><label class="field">花</label><input type="number" id="stageFlower" min="0" step="1"></div>
      <div><label class="field">青果</label><input type="number" id="stageGreenFruit" min="0" step="1"></div>
      <div><label class="field">白熟</label><input type="number" id="stageWhiteFruit" min="0" step="1"></div>
      <div><label class="field">轉色</label><input type="number" id="stageColorTurning" min="0" step="1"></div>
      <div><label class="field">成熟</label><input type="number" id="stageRipe" min="0" step="1"></div>
    </div>
    <div style="margin-top:12px;">
      <button class="primary" id="saveSampleBtn">儲存抽樣</button>
    </div>
    <p class="status" id="sampleStatus"></p>
  </section>

  <section id="trackTab" class="card hidden">
    <h3>標記新的追蹤花果</h3>
    <div class="row">
      <div>
        <label class="field">標記編號</label>
        <input type="text" id="tagId" placeholder="例：A3-07">
      </div>
      <div>
        <label class="field">目前階段</label>
        <select id="tagStage">
          <option value="flower">花</option>
          <option value="green_fruit">青果</option>
          <option value="white_fruit">白熟</option>
          <option value="color_turning">轉色</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label class="field">標記日期</label>
        <input type="date" id="tagDate">
      </div>
    </div>
    <button class="primary" id="saveTagBtn">開始追蹤</button>
    <p class="status" id="tagStatus"></p>

    <h3 style="margin-top:20px;">追蹤中（待回填結果）</h3>
    <div id="trackingList"></div>
    <button class="secondary" id="refreshTrackingBtn">重新整理清單</button>
  </section>
</main>

<div id="resolveDialog" class="hidden" style="position:fixed; inset:0; background:rgba(20,23,19,.5); display:flex; align-items:center; justify-content:center; z-index:50;">
  <div class="card" style="width:90%; max-width:380px;">
    <h3>回填採收結果</h3>
    <p id="resolveTagLabel" style="font-size:13px; color:var(--muted);"></p>
    <label class="field">結果</label>
    <select id="resolveOutcome">
      <option value="harvested_commodity">採收為商品果</option>
      <option value="harvested_culled">採收但淘汰</option>
      <option value="dropped">落果／未成熟即脫落</option>
    </select>
    <div class="row">
      <div>
        <label class="field">採收日期</label>
        <input type="date" id="resolveDate">
      </div>
      <div>
        <label class="field">重量（克，選填）</label>
        <input type="number" id="resolveWeight" min="0" step="0.1">
      </div>
    </div>
    <div class="row">
      <button class="secondary" id="resolveCancelBtn">取消</button>
      <button class="primary" id="resolveSaveBtn">儲存</button>
    </div>
    <p class="status" id="resolveStatus"></p>
  </div>
</div>

<script>
const API_BASE = "https://api.wegrow-orbit.com";
const TOKEN_KEY = "field-entry-token";

function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
function setToken(t) { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }

async function api(path, options = {}) {
  const headers = Object.assign({}, options.headers || {}, { Authorization: `Bearer ${getToken()}` });
  const resp = await fetch(API_BASE + path, Object.assign({}, options, { headers }));
  if (resp.status === 401) { setToken(""); location.reload(); throw new Error("登入已過期"); }
  if (!resp.ok) {
    let detail = resp.statusText;
    try { const j = await resp.json(); detail = j.detail?.error || j.detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return resp.status === 204 ? null : resp.json();
}

let farms = [];
let zones = [];
let currentZoneId = null;
let currentFarmId = null;

function todayStr() { return new Date().toISOString().slice(0, 10); }

async function doLogin() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const statusEl = document.getElementById("loginStatus");
  statusEl.textContent = "登入中…"; statusEl.className = "status";
  try {
    const body = new URLSearchParams({ username: email, password });
    const resp = await fetch(API_BASE + "/auth/login", {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body,
    });
    if (!resp.ok) throw new Error("帳號或密碼錯誤");
    const data = await resp.json();
    setToken(data.access_token);
    document.getElementById("userLabel").textContent = data.user.name || data.user.email;
    await boot();
  } catch (e) {
    statusEl.textContent = e.message; statusEl.className = "status error";
  }
}

async function boot() {
  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("topbar").classList.remove("hidden");
  document.getElementById("mainArea").classList.remove("hidden");
  document.getElementById("harvestDate").value = todayStr();
  document.getElementById("sampleDate").value = todayStr();
  document.getElementById("tagDate").value = todayStr();
  document.getElementById("resolveDate").value = todayStr();
  try {
    farms = await api("/farms/");
  } catch (e) {
    farms = [];
  }
  const farmSelect = document.getElementById("farmSelect");
  farmSelect.innerHTML = farms.map(f => `<option value="${f.id}">${f.name}</option>`).join("");
  if (farms.length) { currentFarmId = farms[0].id; await loadZones(); }
  farmSelect.addEventListener("change", async () => { currentFarmId = farmSelect.value; await loadZones(); });
}

async function loadZones() {
  try {
    zones = await api(`/farms/${currentFarmId}/zones`);
  } catch (e) {
    zones = [];
  }
  const zoneSelect = document.getElementById("zoneSelect");
  zoneSelect.innerHTML = zones.map(z => `<option value="${z.id}">${z.zone_name}${z.variety ? "（" + z.variety + "）" : ""}</option>`).join("");
  currentZoneId = zones.length ? zones[0].id : null;
  zoneSelect.addEventListener("change", () => { currentZoneId = zoneSelect.value; loadTrackingList(); });
  await loadTrackingList();
}

function genSubmissionId() {
  return "fe-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}

async function saveHarvest() {
  const statusEl = document.getElementById("harvestStatus");
  if (!currentZoneId) { statusEl.textContent = "請先選擇分區"; statusEl.className = "status error"; return; }
  const confirmedZero = document.getElementById("harvestConfirmedZero").checked;
  const isCatchup = document.getElementById("harvestIsCatchup").checked;
  const weightKgRaw = document.getElementById("harvestWeightKg").value;
  if (!confirmedZero && weightKgRaw === "") {
    statusEl.textContent = "請填重量，或勾選「確認零採收」"; statusEl.className = "status error"; return;
  }
  let coverageDays = null;
  if (isCatchup) {
    coverageDays = parseInt(document.getElementById("harvestCoverageDays").value, 10);
    if (!coverageDays || coverageDays < 2) {
      statusEl.textContent = "補登請填涵蓋天數（2以上），不能用間隔天數硬猜"; statusEl.className = "status error"; return;
    }
  }
  const premiumGrams = confirmedZero ? 0 : parseFloat(weightKgRaw) * 1000;
  statusEl.textContent = "儲存中…"; statusEl.className = "status";
  try {
    const resp = await api(`/farms/${currentFarmId}/harvest`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        harvest_date: new Date(document.getElementById("harvestDate").value + "T18:00:00+08:00").toISOString(),
        premium_grams: premiumGrams,
        zone_id: parseInt(currentZoneId, 10),
        is_confirmed_zero: confirmedZero,
        coverage_days: coverageDays,
        notes: document.getElementById("harvestNotes").value.trim() || null,
        submission_id: genSubmissionId(),
      }),
    });
    statusEl.textContent = resp.msg || "已儲存"; statusEl.className = "status success";
    document.getElementById("harvestWeightKg").value = "";
    document.getElementById("harvestConfirmedZero").checked = false;
    document.getElementById("harvestIsCatchup").checked = false;
    document.getElementById("harvestCoverageRow").classList.add("hidden");
    document.getElementById("harvestCoverageDays").value = "";
    document.getElementById("harvestNotes").value = "";
  } catch (e) {
    statusEl.textContent = "儲存失敗：" + e.message; statusEl.className = "status error";
  }
}

async function saveSample() {
  const statusEl = document.getElementById("sampleStatus");
  const plantCount = parseInt(document.getElementById("samplePlantCount").value, 10);
  if (!currentZoneId) { statusEl.textContent = "請先選擇分區"; statusEl.className = "status error"; return; }
  if (!plantCount || plantCount < 1) { statusEl.textContent = "請填抽樣株數"; statusEl.className = "status error"; return; }
  const stageFields = [
    ["flower", "stageFlower"], ["green_fruit", "stageGreenFruit"], ["white_fruit", "stageWhiteFruit"],
    ["color_turning", "stageColorTurning"], ["ripe", "stageRipe"],
  ];
  const stageCounts = {};
  for (const [key, id] of stageFields) {
    const v = document.getElementById(id).value;
    if (v !== "") stageCounts[key] = parseInt(v, 10);
  }
  statusEl.textContent = "儲存中…"; statusEl.className = "status";
  try {
    await api(`/api/harvest/farms/${currentFarmId}/zones/${currentZoneId}/fruit-samples`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sampled_at: new Date(document.getElementById("sampleDate").value + "T12:00:00+08:00").toISOString(),
        sample_plant_count: plantCount, stage_counts: stageCounts,
      }),
    });
    statusEl.textContent = "已儲存"; statusEl.className = "status success";
    for (const [, id] of stageFields) document.getElementById(id).value = "";
    document.getElementById("samplePlantCount").value = "";
  } catch (e) {
    statusEl.textContent = "儲存失敗：" + e.message; statusEl.className = "status error";
  }
}

async function saveTag() {
  const statusEl = document.getElementById("tagStatus");
  const tagId = document.getElementById("tagId").value.trim();
  if (!currentZoneId) { statusEl.textContent = "請先選擇分區"; statusEl.className = "status error"; return; }
  if (!tagId) { statusEl.textContent = "請填標記編號"; statusEl.className = "status error"; return; }
  const stage = document.getElementById("tagStage").value;
  const taggedAtDate = document.getElementById("tagDate").value;
  statusEl.textContent = "儲存中…"; statusEl.className = "status";
  try {
    await api(`/api/harvest/farms/${currentFarmId}/zones/${currentZoneId}/fruit-maturity-observations`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        tag_id: tagId, stage_at_tagging: stage,
        tagged_at: new Date(taggedAtDate + "T12:00:00+08:00").toISOString(),
      }),
    });
    statusEl.textContent = "已開始追蹤"; statusEl.className = "status success";
    document.getElementById("tagId").value = "";
    await loadTrackingList();
  } catch (e) {
    statusEl.textContent = "儲存失敗：" + e.message; statusEl.className = "status error";
  }
}

async function loadTrackingList() {
  const listEl = document.getElementById("trackingList");
  if (!currentZoneId) { listEl.innerHTML = '<p class="empty-note">請先選擇分區。</p>'; return; }
  listEl.innerHTML = '<p class="empty-note">載入中…</p>';
  let items = [];
  try {
    const result = await api(`/api/harvest/farms/${currentFarmId}/zones/${currentZoneId}/fruit-maturity-observations?status=still_tracking`);
    items = result.items || [];
  } catch (e) {
    listEl.innerHTML = `<p class="empty-note">讀取失敗：${e.message}</p>`;
    return;
  }
  if (!items.length) {
    listEl.innerHTML = '<p class="empty-note">這個分區目前沒有追蹤中的花果。</p>';
    return;
  }
  listEl.innerHTML = items.map(p => `
    <div class="tracking-item">
      <div class="tag">${p.tag_id}（${STAGE_LABELS[p.stage_at_tagging] || p.stage_at_tagging}）</div>
      <div class="meta">標記於 ${(p.tagged_at || "").slice(0, 10)}</div>
      <button class="secondary" data-obs-id="${p.id}" data-tag="${p.tag_id}" style="margin-top:8px;">回填結果</button>
    </div>
  `).join("");
  listEl.querySelectorAll("button[data-obs-id]").forEach(btn => {
    btn.addEventListener("click", () => openResolveDialog(btn.dataset.obsId, btn.dataset.tag));
  });
}

let resolvingObsId = null;
function openResolveDialog(obsId, tagId) {
  resolvingObsId = obsId;
  document.getElementById("resolveTagLabel").textContent = `標記編號：${tagId}`;
  document.getElementById("resolveDialog").classList.remove("hidden");
}

async function saveResolve() {
  const statusEl = document.getElementById("resolveStatus");
  statusEl.textContent = "儲存中…"; statusEl.className = "status";
  try {
    const weight = document.getElementById("resolveWeight").value;
    await api(`/api/harvest/farms/${currentFarmId}/fruit-maturity-observations/${resolvingObsId}/resolve`, {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        outcome: document.getElementById("resolveOutcome").value,
        actual_harvest_at: new Date(document.getElementById("resolveDate").value + "T12:00:00+08:00").toISOString(),
        harvest_weight_g: weight !== "" ? parseFloat(weight) : null,
      }),
    });
    document.getElementById("resolveDialog").classList.add("hidden");
    await loadTrackingList();
  } catch (e) {
    statusEl.textContent = "儲存失敗：" + e.message; statusEl.className = "status error";
  }
}

const STAGE_LABELS = { flower: "花", green_fruit: "青果", white_fruit: "白熟", color_turning: "轉色" };

document.getElementById("loginBtn").addEventListener("click", doLogin);
document.getElementById("logoutBtn").addEventListener("click", () => { setToken(""); location.reload(); });
document.getElementById("saveHarvestBtn").addEventListener("click", saveHarvest);
document.getElementById("harvestIsCatchup").addEventListener("change", (e) => {
  document.getElementById("harvestCoverageRow").classList.toggle("hidden", !e.target.checked);
});
document.getElementById("harvestConfirmedZero").addEventListener("change", (e) => {
  const weightInput = document.getElementById("harvestWeightKg");
  weightInput.disabled = e.target.checked;
  if (e.target.checked) weightInput.value = "";
});
document.getElementById("saveSampleBtn").addEventListener("click", saveSample);
document.getElementById("saveTagBtn").addEventListener("click", saveTag);
document.getElementById("resolveCancelBtn").addEventListener("click", () => document.getElementById("resolveDialog").classList.add("hidden"));
document.getElementById("resolveSaveBtn").addEventListener("click", saveResolve);
document.getElementById("refreshTrackingBtn").addEventListener("click", loadTrackingList);

const TABS = {
  harvest: { btn: "tabHarvestBtn", section: "harvestTab" },
  sample: { btn: "tabSampleBtn", section: "sampleTab" },
  track: { btn: "tabTrackBtn", section: "trackTab" },
};
function showTab(active) {
  for (const key of Object.keys(TABS)) {
    document.getElementById(TABS[key].btn).classList.toggle("active", key === active);
    document.getElementById(TABS[key].section).classList.toggle("hidden", key !== active);
  }
}
document.getElementById("tabHarvestBtn").addEventListener("click", () => showTab("harvest"));
document.getElementById("tabSampleBtn").addEventListener("click", () => showTab("sample"));
document.getElementById("tabTrackBtn").addEventListener("click", () => showTab("track"));

if (getToken()) { boot(); }
</script>
</body>
