<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sol-WeGrow-Farm</title>
<meta name="description" content="企業員工入口：看現場、活動回憶、ESG下載。">
<meta name="build-version" content="20261018T1-booking-eligibility-claim" data-testid="wegrow-build-stamp">
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --ink: #141713; --muted: #596258; --paper: #fbfaf4; --white: #ffffff;
    --line: #dfded4; --gold: #b68a35; --green: #153f2a; --mist: #eef1e8; --rose: #c84c41;
    --shadow: 0 24px 80px rgba(20, 23, 19, .13);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif; background:var(--paper); color:var(--ink); }
  a { color:inherit; text-decoration:none; }
  button { cursor:pointer; font-family:inherit; }
  .hidden { display:none !important; }

  header.topbar {
    position: sticky; top:0; z-index:20; background: var(--white);
    border-bottom: 1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 20px;
  }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-name { font-size:16px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand-sub { font-size:11px; color: var(--muted); }
  .user-menu { display:flex; align-items:center; gap:10px; font-size:13px; color: var(--muted); flex:0 0 auto; }
  .user-menu button { border:1px solid var(--line); background:var(--white); border-radius:999px; padding:6px 14px; font-size:12px; color:var(--ink); white-space:nowrap; }
  #userEmailLabel { display:none; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } /* 窄螢幕先隱藏email，避免跟品牌名稱擠在同一行溢出；桌機才顯示，且長信箱截斷 */
  header.topbar { flex-wrap: nowrap; gap: 8px; }
  .brand { flex: 1 1 auto; min-width: 0; }

  main { max-width: 900px; margin: 0 auto; padding: 0 0 90px; }

  /* ---- login ---- */
  #loginCard { max-width: 420px; margin: 60px auto; background: var(--white); border:1px solid var(--line); border-radius:12px; padding:28px 24px; box-shadow: var(--shadow); }
  #loginCard h2 { margin:0 0 6px; font-size:18px; }
  #loginCard p { font-size:13px; color: var(--muted); margin: 0 0 18px; }
  #loginCard label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  #loginCard input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); font-size:14px; margin-bottom:14px; }
  #loginCard button.primary { width:100%; background: var(--green); color:#fff; border:none; border-radius:8px; padding:12px; font-size:14px; font-weight:700; }
  .status { font-size:13px; margin:8px 0 0; }
  .status.error { color: var(--rose); }
  .status.success { color: var(--green); }

  /* ---- farm switcher ---- */
  #farmSwitcher { display:flex; gap:8px; padding: 14px 16px 0; overflow-x:auto; }
  #farmSwitcher button { flex:0 0 auto; border:1px solid var(--line); background:var(--white); border-radius:999px; padding:7px 14px; font-size:13px; }
  #farmSwitcher button.active { background: var(--green); color:#fff; border-color: var(--green); }

  /* ---- 看現場 ---- */
  .live-hero { margin: 14px 16px 0; border-radius:14px; overflow:hidden; background:var(--mist); position:relative; box-shadow: var(--shadow); }
  .live-hero img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; cursor:zoom-in; background:var(--mist); }
  .live-hero .meta { position:absolute; left:0; right:0; bottom:0; padding:14px 16px; background:linear-gradient(0deg, rgba(20,23,19,.72), transparent); color:#fff; }
  .live-hero .meta .farm-name { font-size:15px; font-weight:800; }
  .live-hero .meta .captured-at { font-size:12px; opacity:.92; margin-top:2px; }
  .live-hero .zoom-btn { position:absolute; right:12px; top:12px; background:rgba(20,23,19,.55); color:#fff; border:none; border-radius:999px; padding:8px 14px; font-size:12px; }
  .live-empty { margin:14px 16px 0; padding:40px 20px; text-align:center; background:var(--white); border:1px dashed var(--line); border-radius:14px; color:var(--muted); font-size:14px; }
  .live-banner { margin: 10px 16px 0; padding: 10px 14px; border-radius: 10px; font-size: 13px; }
  .live-banner.stale { background:#fff6ea; color:#8a5a12; border:1px solid #f0d9ad; }
  .live-banner.broken { background:#fdeceb; color:#a3382e; border:1px solid #f3c4bf; }
  .live-banner.denied { background:var(--mist); color:var(--muted); border:1px solid var(--line); }

  .wg-offer-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 0; border-bottom:1px solid var(--line); }
  .wg-offer-row:last-child { border-bottom:none; }
  .wg-offer-row p { margin:0; flex:1 1 auto; font-size:13px; }
  .wg-offer-row button { border:1px solid var(--line); border-radius:8px; padding:6px 12px; background:var(--white); font-size:13px; }

  .wg-ship-modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .wg-ship-modal-card { background:var(--white); border-radius:14px; padding:20px; max-width:420px; width:100%; max-height:80vh; overflow-y:auto; }
  .wg-ship-modal-card h3 { margin:0 0 12px; font-size:15px; }
  .wg-ship-input { display:block; width:100%; margin:0 0 8px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; box-sizing:border-box; }
  .wg-ship-modal-card button { border:1px solid var(--line); border-radius:8px; padding:8px 14px; background:var(--white); font-size:13px; margin:4px 4px 4px 0; }
  .wg-ship-close { margin-top:14px; }

  .card { margin: 16px 16px 0; background: var(--white); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .card h3 { margin:0 0 10px; font-size:14px; color: var(--muted); font-weight:700; }
  .update-text { font-size:15px; line-height:1.6; }
  .empty-note { font-size:13px; color: var(--muted); }

  .record-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .record-row:last-child { border-bottom:none; }
  .record-row .date { color:var(--muted); }

  /* ---- 認養位置地圖：威果黃／深灰品牌配色（2026-09-28） ---- */
  .wg-adoption-map {
    --wg-yellow: #E2CF35;
    --wg-yellow-soft: #FBF3C8;
    --wg-ink: #424242;
    --wg-muted: #808080;
    --wg-bg: #F7F7F3;
    --wg-surface: #FFFFFF;
    --wg-row: #E5E7E7;
    --wg-line: #B8BDBF;
    --wg-focus: #424242;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--wg-ink);
    padding: 24px;
  }
  @media (max-width: 720px) { .wg-adoption-map { padding: 16px; } }
  .map-header-row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .map-header-left { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; min-width:0; }
  .map-header-left h3 { margin:0; font-size:16px; font-weight:800; color:var(--wg-ink); }
  .map-farm-subtitle { font-size:13px; color: var(--wg-muted, var(--muted)); }
  .map-badge {
    display:inline-flex; align-items:center; gap:5px; background:var(--wg-yellow-soft);
    color:var(--wg-ink); font-size:12px; font-weight:700; border-radius:999px; padding:5px 12px;
  }
  .map-toolbar { display:flex; gap:8px; flex-wrap:wrap; }
  .map-toolbar button {
    border:1px solid var(--wg-line); background:var(--wg-surface); border-radius:999px;
    padding:8px 16px; font-size:13px; color:var(--wg-ink); min-height:44px;
  }
  .map-toolbar button.primary { background: var(--wg-yellow); color: var(--wg-ink); border-color: var(--wg-yellow); font-weight:700; }
  .map-toolbar button:focus-visible {
    outline:3px solid var(--wg-focus); outline-offset:2px;
  }
  .map-viewport {
    position:relative; width:100%; aspect-ratio:96/48; background:var(--wg-bg);
    border-radius:10px; overflow:hidden; touch-action:none; cursor:grab;
  }
  .map-viewport.grabbing { cursor:grabbing; }
  .map-viewport svg { width:100%; height:100%; display:block; }
  .map-row { fill:url(#wgRowGrain); stroke:var(--wg-line); stroke-width:0.25; cursor:pointer; }
  .map-row:hover { stroke:var(--wg-ink); stroke-width:0.4; }
  .map-row:focus-visible { outline:none; stroke:var(--wg-focus); stroke-width:0.9; stroke-dasharray:1.2,0.8; }
  .map-row.mine { fill:var(--wg-yellow); stroke:var(--wg-ink); stroke-width:0.6; }
  /* 選取：額外深灰虛線外框，保留原本填色（本企業排選取後仍是黃色，其他排選取後維持灰色，不能變黃） */
  .map-row.selected { stroke:var(--wg-ink); stroke-width:0.7; stroke-dasharray:1.4,0.9; }
  .map-row.nursery { fill:#EFEFEF; stroke:var(--wg-line); stroke-dasharray:1,0.6; }
  .map-row-label { font-size:2.1px; fill:var(--wg-ink); font-weight:600; pointer-events:none; }
  .map-row-label.mine { font-weight:800; }
  .map-row-note { font-size:1.5px; fill:var(--wg-muted); pointer-events:none; }
  .map-zone-band-bg { fill:var(--wg-yellow-soft); }
  .map-zone-band-label { font-size:2.3px; fill:var(--wg-ink); font-weight:700; pointer-events:none; text-anchor:middle; dominant-baseline:middle; }
  .map-walkway-label { font-size:1.9px; fill:var(--wg-muted); text-anchor:middle; dominant-baseline:middle; letter-spacing:.1px; }
  .map-entrance-label { font-size:2.1px; fill:var(--wg-ink); font-weight:700; text-anchor:middle; dominant-baseline:middle; }
  .map-entrance-arrow { fill:var(--wg-ink); }
  .map-workspace-box { fill:var(--wg-surface); stroke:var(--wg-line); stroke-dasharray:1,0.8; }
  .map-workspace-label { font-size:1.8px; fill:var(--wg-muted); text-anchor:middle; dominant-baseline:middle; }
  .map-mine-callout-box { fill:var(--wg-ink); }
  .map-mine-callout-title { font-size:1.9px; fill:#fff; font-weight:700; text-anchor:middle; dominant-baseline:middle; }
  .map-mine-callout-sub { font-size:1.7px; fill:var(--wg-yellow); font-weight:700; text-anchor:middle; dominant-baseline:middle; }
  .map-legend { display:flex; gap:14px; margin-top:10px; font-size:12px; color:var(--wg-muted); flex-wrap:wrap; }
  .map-legend .swatch { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px; border:1px solid var(--wg-line); }
  .map-info-panel { margin-top:10px; padding:10px 12px; background:var(--wg-bg); border-radius:10px; font-size:13px; display:none; }
  .map-info-panel.show { display:block; }
  .map-row-list { margin-top:10px; }
  .map-row-list summary { font-size:12px; color:var(--wg-muted); cursor:pointer; }
  .map-row-chip { display:inline-block; font-size:11px; padding:3px 8px; border-radius:999px; background:var(--wg-row); color:var(--wg-ink); margin:4px 4px 0 0; }
  .map-row-chip.mine { background: var(--wg-yellow); color:var(--wg-ink); font-weight:800; }

  /* ---- 活動回憶 ---- */
  .activity-item { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .activity-item:last-child { border-bottom:none; }
  .activity-item img { width:84px; height:60px; object-fit:cover; border-radius:8px; background:var(--mist); flex:0 0 auto; }
  .activity-item .info strong { font-size:14px; }
  .activity-item .info div { font-size:12px; color:var(--muted); margin-top:3px; }
  .gallery-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(96px,1fr)); gap:8px; margin-top:12px; }
  .gallery-grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; cursor:zoom-in; background:var(--mist); }
  .back-link { display:inline-block; margin: 14px 16px 0; font-size:13px; color:var(--muted); cursor:pointer; }

  /* ---- ESG ---- */
  .esg-item { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); gap:10px; }
  .esg-item:last-child { border-bottom:none; }
  .esg-item .info strong { font-size:14px; display:block; }
  .esg-item .info div { font-size:12px; color:var(--muted); margin-top:3px; }
  .esg-item button { flex:0 0 auto; border:1px solid var(--green); color:var(--green); background:#fff; border-radius:999px; padding:7px 14px; font-size:12px; font-weight:700; }
  .esg-disclaimer { font-size:12px; color:var(--muted); margin-top:10px; line-height:1.6; }

  /* ---- bottom nav (mobile) ---- */
  nav.bottom-nav {
    position: fixed; left:0; right:0; bottom:0; z-index:30;
    background: var(--white); border-top:1px solid var(--line);
    display:flex; padding-bottom: env(safe-area-inset-bottom);
  }
  nav.bottom-nav button {
    flex:1; border:none; background:none; padding:10px 4px 8px; font-size:11px; color: var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav.bottom-nav button .icon { font-size:18px; }
  nav.bottom-nav button.active { color: var(--green); font-weight:800; }

  @media (min-width: 720px) {
    nav.bottom-nav { display:none; }
    .desktop-nav { display:flex !important; }
    #userEmailLabel { display:inline; }
  }
  .desktop-nav { display:none; gap:6px; }
  .desktop-nav button { border:1px solid var(--line); background:var(--white); border-radius:999px; padding:8px 16px; font-size:13px; color:var(--muted); }
  .desktop-nav button.active { background: var(--green); color:#fff; border-color: var(--green); }

  #lightbox { position:fixed; inset:0; background:rgba(10,12,9,.92); z-index:100; display:flex; align-items:center; justify-content:center; }
  #lightbox img { max-width:94vw; max-height:88vh; object-fit:contain; }
  #lightbox .close { position:absolute; top:16px; right:20px; color:#fff; font-size:28px; background:none; border:none; }

  /* ---- O4 強制更新提示 ---- */
  #updateBanner {
    position:fixed; left:0; right:0; top:0; z-index:200;
    background:var(--gold); color:#141713; padding:10px 16px;
    display:flex; align-items:center; justify-content:center; gap:14px;
    font-size:13px; box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  #updateBanner button {
    background:#141713; color:#fff; border:none; border-radius:999px;
    padding:6px 16px; font-size:12px; font-weight:700;
  }
.farm-photo-button{display:block;padding:0;border:0;background:none;width:100%;cursor:zoom-in}.farm-photo-button img{display:block;width:100%;height:auto;border-radius:12px}.farm-photo-button:focus-visible{outline:3px solid #F2C230;outline-offset:4px}
</style>
</head>
<body>

<div id="updateBanner" class="hidden" data-testid="wegrow-update-banner">
  <span>偵測到新版，請重新載入</span>
  <button id="updateBannerReloadBtn">重新載入新版</button>
</div>

<div id="sessionRestoring" class="hidden" style="max-width:420px;margin:60px auto;text-align:center;color:var(--muted);font-size:14px;padding:20px;">
  正在恢復登入狀態…
</div>

<div id="loginCard">
  <h2>企業員工登入</h2>
  <p>請用威果管理員開通的帳號登入，只會看到您企業已授權的農場內容。這不是Demo，會實際呼叫 WeGrow Orbit 後端。</p>
  <form id="loginForm">
    <label>帳號 Email</label>
    <input type="email" id="loginEmail" autocomplete="username" required>
    <label>密碼</label>
    <input type="password" id="loginPassword" autocomplete="current-password" required>
    <button type="submit" class="primary">登入</button>
  </form>
  <p class="status" id="loginStatus"></p>
</div>

<div id="appShell" class="hidden">
  <header class="topbar">
    <div class="brand">
      <div>
        <div class="brand-name" id="orgBrandName">Sol-WeGrow-Farm</div>
        <div class="brand-sub">by WeGrow</div>
      </div>
    </div>
    <div class="desktop-nav" id="desktopNav">
      <button data-tab="live" class="active">看現場</button>
      <button data-tab="activities">活動回憶</button>
      <button data-tab="esg">ESG 下載</button>
    </div>
    <div class="user-menu">
      <span id="userEmailLabel"></span>

  <div id="farmSwitcher"></div>

  <main>
    <!-- 看現場 -->
    <section id="tabLive">
      <div id="liveHeroWrap"></div>
      <section class="card" id="adoptionOfferCard" style="display:none"><h3>這批草莓要寄送嗎？</h3><div id="adoptionOfferBody"></div></section>
      <section class="card"><h3>收成與配送</h3><div id="harvestOutlookBody"></div></section>
      <div class="card wg-adoption-map hidden" id="layoutMapCard">
        <div id="layoutMapBody"></div>
      </div>
      <div class="card">
        <h3>農場近況</h3>
        <div id="farmUpdateBody"><p class="empty-note">尚無近況更新。</p></div>
      </div>
      <div class="card">
        <h3>成長紀錄</h3>
        <div id="growthRecordBody"><p class="empty-note">尚無紀錄。</p></div>
      </div>
    </section>

    <!-- 活動回憶 -->
    <section id="tabActivities" class="hidden">
      <div class="card" id="activityListCard">
        <h3>活動回憶</h3>
        <div id="activityListBody"><p class="empty-note">目前沒有可查看的活動。</p></div>
      </div>
      <div class="hidden" id="activityDetailCard">
        <span class="back-link" id="activityBackLink">← 返回活動列表</span>
        <div class="card">
          <h3 id="activityDetailTitle"></h3>
          <p id="activityDetailMeta" style="font-size:13px;color:var(--muted);"></p>
          <p id="activityDetailDesc" style="font-size:14px;line-height:1.6;"></p>
          <div class="gallery-grid" id="activityGallery"></div>
          <div id="activityAttachments" style="margin-top:12px;"></div>

    </section>

    <!-- ESG -->
    <section id="tabEsg" class="hidden">
      <div class="card">
        <h3>ESG 成果文件</h3>
        <div id="esgListBody"><p class="empty-note">本期資料整理中。</p></div>
        <p class="esg-disclaimer">認養不自動等於 ESG 加分或減碳量。以上為已發布之正式文件，版本與期間如上標示。</p>
      </div>
    </section>
  </main>

  <div id="shipmentModal" class="wg-ship-modal" style="display:none">
    <div class="wg-ship-modal-card">
      <h3>寄送確認（私密）</h3>
      <div id="shipmentModalBody"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button data-tab="live" class="active"><span class="icon">🌱</span>看現場</button>
    <button data-tab="activities"><span class="icon">📷</span>活動回憶</button>
    <button data-tab="esg"><span class="icon">📄</span>ESG 下載</button>
  </nav>
</div>

<div id="lightbox" class="hidden">
  <button class="close" id="lightboxClose">×</button>
  <img id="lightboxImg" alt="放大檢視">
</div>

<script>
(function () {
  const API_BASE = window.FARM_PORTAL_API_BASE || "https://api.wegrow-orbit.com";
  const TOKEN_KEY = "farm-portal-token";

  // ==================== farm-booking 免費參訪資格交換（2026-10-17）====================
  // 客戶從booking.wegrow-orbit.com的預約頁被導過來，帶著nonce跟return_url。這裡在
  // 「真實登入成功」之後（afterLogin()內、showApp()之後）才呼叫claim API——身分
  // 完全來自這次登入拿到的token，不是URL上任何客戶可以自己改的欄位。return_url
  // 的目的地網域白名單檢查是防止這個登入頁被當成open redirect/釣魚中繼站用。
  const BOOKING_RETURN_ORIGIN_ALLOWLIST = ["https://booking.wegrow-orbit.com", "http://localhost:3000"];

  async function handleBookingEligibilityRedirect() {
    const params = new URLSearchParams(window.location.search);
    const nonce = params.get("booking_eligibility_nonce");
    const visitDate = params.get("booking_visit_date");
    const returnUrl = params.get("booking_return_url");
    if (!nonce || !visitDate || !returnUrl) return; // 一般portal訪問，不是從booking導過來的

    let target;
    try { target = new URL(returnUrl); } catch { return; }
    if (!BOOKING_RETURN_ORIGIN_ALLOWLIST.includes(target.origin)) {
      setStatus("loginStatus", "預約來源網址不受信任，請直接回到威果農場預約頁面重新操作。", "error");
      return;
    }

    setStatus("loginStatus", "正在確認免費參訪資格…");
    // 2026-10-17修正：原本把「fetch失敗/非200」跟「claim正常回應但eligible:false」
    // 都當成同一種"eligible=0"——booking端看到這個值會顯示「你的資格未通過」，
    // 但服務本身打不通根本沒驗證到任何東西，不該講成「你不符合資格」。這裡分三種
    // 結果：eligible=1(通過)／eligible=0&reason=...(真的核對過不符合)／
    // eligible=error(服務本身有問題，無法判定)。
    let outcome = { eligible: "error" };
    try {
      const resp = await apiFetch("/api/customer/booking-eligibility/claim", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nonce, visit_date: visitDate }),
      });
      if (resp.ok) {
        const body = await resp.json();
        outcome = body.eligible ? { eligible: "1" } : { eligible: "0", reason: body.reason || "" };
      }
    } catch { /* 網路失敗——保持outcome = error，不冒充任何已驗證的結果 */ }

    target.searchParams.set("eligible", outcome.eligible);
    if (outcome.reason) target.searchParams.set("eligibilityReason", outcome.reason);
    window.location.href = target.toString();
  }

  // ==================== O4 強制更新提示 ====================
  // 2026-09-28：Clement實測抓到——已開啟的舊分頁不會自己偵測新版，只有手動重新整理
  // 才會拿到新程式碼。只在頁面可見時檢查(節省流量、避免背景分頁狂打)，抓到<meta
  // name="build-version">跟目前不一樣就顯示提示，不強制reload(怕使用者正在填資料)。
  const CURRENT_BUILD_VERSION = document.querySelector('meta[name="build-version"]')?.content || "";
  let updateCheckTimer = null;

  async function checkForUpdate() {
    if (document.visibilityState !== "visible") return;
    try {
      const resp = await fetch(location.pathname + "?_v=" + Date.now(), { cache: "no-store" });
      if (!resp.ok) return;
      const html = await resp.text();
      const match = html.match(/<meta\s+name="build-version"\s+content="([^"]*)"/);
      const latestVersion = match ? match[1] : "";
      if (latestVersion && CURRENT_BUILD_VERSION && latestVersion !== CURRENT_BUILD_VERSION) {
        document.getElementById("updateBanner").classList.remove("hidden");
        if (updateCheckTimer) { clearInterval(updateCheckTimer); updateCheckTimer = null; }
      }
    } catch {
      // 檢查失敗不影響現有功能，靜默略過，下次輪詢再試
    }
  }
  document.getElementById("updateBannerReloadBtn").addEventListener("click", () => location.reload());
  updateCheckTimer = setInterval(checkForUpdate, 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });

  function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
  function setToken(t) { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }
  async function apiFetch(path, options) {
    const headers = Object.assign({}, (options && options.headers) || {}, { Authorization: `Bearer ${getToken()}` });
    return fetch(`${API_BASE}${path}`, Object.assign({}, options, { headers }));
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmtDateTime(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleString("zh-TW", { timeZone: "Asia/Taipei" });
  }
  function fmtDate(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleDateString("zh-TW", { timeZone: "Asia/Taipei" });
  }
  function setStatus(id, text, cls) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = text || "";
    el.className = "status" + (cls ? " " + cls : "");
  }

  // 2026-09-26 沿用index.html#admin既有驗證過的做法：私有照片/文件端點都要驗
  // Authorization Bearer header，<img src>/<a href>本身送不出這個header，一定要
  // 先用fetch(帶header)把內容抓成blob，再轉成object URL塞進src，或觸發下載。
  const objectUrls = [];
  async function loadAuthedImage(path, imgEl, onError) {
    try {
      const resp = await apiFetch(path);
      if (!resp.ok) { if (onError) onError(resp.status); return; }
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      objectUrls.push(url);
      imgEl.src = url;
    } catch { if (onError) onError(0); }
  }
  async function triggerAuthedDownload(path, filename) {
    const resp = await apiFetch(path);
    if (!resp.ok) return false;
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename || "download";
    document.body.appendChild(a);
    a.click();
    // 不要在click()後馬上remove()——瀏覽器(尤其headless自動化環境)啟動下載是非同步的，
    // 太快把<a>從DOM移除或revoke掉blob URL會讓下載被悄悄取消掉，看起來像「什麼都沒發生」。
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 30000);
    return true;
  }

  let currentFarmId = null;
  let farms = [];

  // 2026-09-27 修復白屏：不管是「剛登入」還是「用舊token恢復工作階段」，畫面永遠只能是
  // 三種狀態之一——載入中／登入表單（含錯誤訊息）／主畫面，不能同時把登入表單跟主畫面
  // 都隱藏起來（那就是白屏，之前的bug就是這樣：舊token失敗時錯誤訊息寫進已經被隱藏的
  // loginCard，使用者只看到空白）。
  function showRestoring() {
    document.getElementById("sessionRestoring").classList.remove("hidden");
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("appShell").classList.add("hidden");
  }
  function showLoginCard(message) {
    document.getElementById("sessionRestoring").classList.add("hidden");
    document.getElementById("appShell").classList.add("hidden");
    document.getElementById("loginCard").classList.remove("hidden");
    if (message) setStatus("loginStatus", message, "error");
  }
  function showApp() {
    document.getElementById("sessionRestoring").classList.add("hidden");
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("appShell").classList.remove("hidden");
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    setStatus("loginStatus", "登入中…");
    let resp;
    try {
      const body = new URLSearchParams({ username: email, password });
      resp = await fetch(`${API_BASE}/auth/login`, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString() });
    } catch { setStatus("loginStatus", "無法連線到 WeGrow Orbit 後端，請稍後再試。", "error"); return; }
    if (!resp.ok) { setStatus("loginStatus", "登入失敗：Email 或密碼錯誤。", "error"); return; }
    const result = await resp.json();
    setToken(result.access_token);
    await afterLogin();
  });

  // afterLogin() 對外只有兩種結果：成功叫showApp()，失敗一律叫showLoginCard(訊息)並清掉
  // token——不管失敗原因是401、其他4xx（沒會籍/需要改密碼）、還是fetch本身丟例外
  // （斷網），都不能讓呼叫端還停在「登入表單跟主畫面都隱藏」的中間狀態。
  async function afterLogin() {
    let meResp;
    try {
      meResp = await apiFetch("/api/customer/me");
    } catch {
      setToken("");
      showLoginCard("無法連線到 WeGrow Orbit 後端，請檢查網路後重新登入。");
      return;
    }
    if (meResp.status === 401) {
      setToken("");
      showLoginCard("登入已過期，請重新登入。");
      return;
    }
    if (!meResp.ok) {
      const body = await meResp.json().catch(() => ({}));
      setToken("");
      showLoginCard(body.detail === "password_change_required" ? "首次登入必須更換密碼才能繼續，請聯絡威果協助處理。" : "此帳號尚未被開通任何企業會籍，請聯絡威果確認。");
      return;
    }
    const me = await meResp.json();
    // 2026-09-28：主標題固定顯示Sol-WeGrow-Farm，不再用企業名稱拼接——企業身分仍用於
    // 驗權(membership_role/organization.id)，只是不再反映到畫面標題文字。
    document.title = "Sol-WeGrow-Farm";
    document.getElementById("orgBrandName").textContent = "Sol-WeGrow-Farm";
    if (me.user && me.user.email) document.getElementById("userEmailLabel").textContent = me.user.email;
    showApp();

    // 這次登入若是從farm-booking的免費參訪流程導過來的，先處理資格交換再導回去——
    // 不等farms/activities/ESG載入，避免客戶在這個分頁卡太久看不到自己要的結果。
    const params = new URLSearchParams(window.location.search);
    if (params.get("booking_eligibility_nonce")) {
      await handleBookingEligibilityRedirect();
      return;
    }

    // 2026-10-17審查修正：farms、activities、ESG三段彼此獨立——任何一段失敗或丟例外
    // 都不能擋住另外兩段渲染（原本全部包在同一個try/catch，activities丟錯會讓ESG整段
    // 不執行）。farms這段還要分清楚401/403/5xx跟「成功但真的是空陣列」，不能
    // `farmsResp.ok ? data : []`把兩種完全不同的情況都倒成同一個「未選區」畫面。
    try {
      const farmsResp = await apiFetch("/api/customer/farms");
      if (farmsResp.status === 401) {
        setToken(""); showLoginCard("登入已過期，請重新登入。"); return;
      }
      if (!farmsResp.ok) {
        farms = [];
        renderFarmSwitcher();
        document.getElementById("liveHeroWrap").innerHTML = `<div class="live-empty">場域資料暫時無法載入，請稍後重試。</div>`;
      } else {
        farms = await farmsResp.json();
        renderFarmSwitcher();
        if (farms.length) {
          currentFarmId = farms[0].farm_id;
          await loadLiveTab();
        } else {
          // 帳號已開通、farms API成功回傳空陣列＝真的尚未選區，不是帳號異常。目前沒有
          // 後端的「大區共用實景」端點可呼叫（已盤點：候選來源是麻豆1場
          // farm_id=e9348cd2-6cca-4583-a86d-8011032b5570，DEMO企業用的就是這個，有
          // all_farm+photo entitlement 到2036年——但目前沒有不要求個人zone授權的
          // 共用讀取端點，所以這裡還是誠實顯示「照片更新中」，不借用其他企業資料）。
          await loadSharedOverview();
        }
      }
    } catch {
      document.getElementById("liveHeroWrap").innerHTML = `<div class="live-empty">場域資料暫時無法載入，請稍後重試。</div>`;
    }
    try { await loadActivities(); } catch { /* 活動區塊失敗不影響其他區塊 */ }
    try { await loadEsgDocuments(); } catch { /* ESG區塊失敗不影響其他區塊 */ }
  }

  async function loadSharedOverview() {
    // 2026-10-17：改接真正的/api/customer/shared-overview（後端admin明確指定共用
    // farm+zone，不是前端猜的）。目前沒有任何farm被admin設定為共用來源，所以
    // available會是false，畫面照樣落回「尚未選區／照片更新中」——這不是前端寫死，
    // 是後端誠實回報「還沒有可共用的實景」。
    // 收成與配送區塊只在loadLiveTab()（有farm_id時）才會被填內容，未選區帳號從未
    // 呼叫過那段，原本會整個留空白卡片——改成跟「農場近況」「成長紀錄」一致的
    // 簡短狀態文字，不留空白。
    const outlook = document.getElementById('harvestOutlookBody');
    if (outlook) { outlook.textContent = '尚未選區，暫無收成與配送資料。'; }
    const wrap = document.getElementById("liveHeroWrap");
    wrap.innerHTML = "";
    try {
      const statusResp = await apiFetch("/api/customer/shared-overview", { cache: "no-store" });
      if (!statusResp.ok) {
        wrap.innerHTML = `<div class="live-empty">場域資料暫時無法載入，請稍後重試。</div>`;
        return;
      }
      const status = await statusResp.json();
      if (!status.available) {
        wrap.innerHTML = `<div class="live-empty">尚未選區<br><span style="font-size:13px;opacity:.7;display:block;margin-top:6px">照片更新中</span></div>`;
        return;
      }
      const imgResp = await apiFetch("/api/customer/shared-overview/image", { cache: "no-store" });
      if (!imgResp.ok) {
        wrap.innerHTML = `<div class="live-empty">照片載入失敗，請稍後重試。</div>`;
        return;
      }
      const blob = await imgResp.blob();
      const url = URL.createObjectURL(blob);
      const heading = document.createElement("h2");
      heading.textContent = photoHeading(status.captured_at);
      const sub = document.createElement("p");
      sub.className = "live-empty";
      sub.style.cssText = "padding:4px 16px;margin:0 0 8px;background:none;border:none;text-align:left;font-size:13px;";
      sub.textContent = "農場大區實景（尚未選區，顯示共用展示畫面）";
      const button = document.createElement("button");
      button.className = "farm-photo-button";
      button.type = "button";
      button.setAttribute("aria-label", "放大農場大區實景");
      const img = document.createElement("img");
      img.src = url;
      img.alt = "農場大區實景";
      button.append(img);
      button.addEventListener("click", () => openLightbox(img.src));
      wrap.append(heading, sub, button);
    } catch {
      wrap.innerHTML = `<div class="live-empty">場域資料暫時無法載入，請稍後重試。</div>`;
    }
  }

  function renderFarmSwitcher() {
    const el = document.getElementById("farmSwitcher");
    if (farms.length <= 1) { el.innerHTML = ""; return; }
    el.innerHTML = farms.map(f => `<button data-farm="${f.farm_id}" class="${f.farm_id === currentFarmId ? 'active' : ''}">${escapeHtml(f.farm_name)}</button>`).join("");
    el.querySelectorAll("button").forEach(btn => btn.addEventListener("click", async () => {
      currentFarmId = btn.getAttribute("data-farm");
      el.querySelectorAll("button").forEach(b => b.classList.toggle("active", b === btn));
      document.getElementById("liveHeroWrap").innerHTML = "";
      await loadLiveTab();
    }));
  }

  function liveBannerFor(farm) {
    if (!farm.latest_photo_captured_at) return "";
    if (!farm.expected_update_interval_minutes) return "";
    const ageMinutes = (Date.now() - new Date(farm.latest_photo_captured_at).getTime()) / 60000;
    if (ageMinutes > farm.expected_update_interval_minutes) {
      return `<div class="live-banner stale">影像尚未更新，最後拍攝時間：${fmtDateTime(farm.latest_photo_captured_at)}</div>`;
    }
    return "";
  }

  let liveRequest = 0;
  let liveAbort = null;
  let livePhotoUrl = null;

  function clearLivePhoto() {
    if (livePhotoUrl) URL.revokeObjectURL(livePhotoUrl);
    livePhotoUrl = null;
  }
  function photoHeading(iso) {
    const date = new Date(iso);
    if (!Number.isFinite(date.getTime())) return '農場現場照';
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric' }).formatToParts(date);
    return `${parts.find(p=>p.type==='month').value}月${parts.find(p=>p.type==='day').value}日更新農場照`;
  }

  async function loadLiveTab() {
    const id = ++liveRequest;
    liveAbort?.abort();
    liveAbort = new AbortController();
    const signal = liveAbort.signal;
    const farmId = currentFarmId;
    const token = getToken();
    const current = () => id === liveRequest && farmId === currentFarmId && token === getToken() && !signal.aborted;
    const wrap = document.getElementById('liveHeroWrap');
    const outlook = document.getElementById('harvestOutlookBody');
    wrap.replaceChildren();
    outlook.replaceChildren();
    clearLivePhoto();
    if (!farmId || !token) return;
    const read = async path => {
      const res = await apiFetch(path, {signal, cache:'no-store'});
      if (!res.ok) {
        if (current() && res.status === 401) { setToken(''); showLoginCard('登入已過期，請重新登入。'); }
        throw new Error(String(res.status));
      }
      return res;
    };
    const photoTask = async () => {
      try {
        const photos = await (await read(`/api/customer/photos?farm_id=${encodeURIComponent(farmId)}`)).json();
        if (!current()) return;
        const latest = photos[0];
        if (!latest) {
          const note = document.createElement('p');
          note.className = 'live-empty';
          note.textContent = '這個認養區尚未發布現場照片，以下為相機安裝後畫面示意：';
          const demoImg = document.createElement('img');
          demoImg.src = 'farm-photo-demo-20261016.jpg';
          demoImg.alt = '溫室內部示意圖（非實際相機拍攝，僅供參考）';
          demoImg.style.cssText = 'width:100%;height:auto;border-radius:8px;display:block;';
          wrap.replaceChildren(note, demoImg);
          return;
        }
        const blob = await (await read(`/api/customer/photos/${encodeURIComponent(latest.id)}/image`)).blob();
        if (!current()) return;
        livePhotoUrl = URL.createObjectURL(blob);
        const heading = document.createElement('h2');
        heading.textContent = photoHeading(latest.captured_at);
        const button = document.createElement('button');
        button.className = 'farm-photo-button';
        button.type = 'button';
        button.setAttribute('aria-label','放大農場現場照片');
        const img = document.createElement('img');
        img.src = livePhotoUrl;
        img.alt = '農場現場照片';
        button.append(img);
        button.addEventListener('click',()=>openLightbox(img.src));
        wrap.append(heading,button);
      } catch (error) {
        if (!current()) return;
        wrap.textContent = error.message==='403' ? '目前沒有此照片的檢視權限。' : '照片載入失敗。';
        const retry=document.createElement('button');retry.textContent='重試';retry.onclick=loadLiveTab;wrap.append(retry);
      }
    };
    const harvestTask = async () => {
      try {
        const data = await (await read(`/api/customer/farms/${encodeURIComponent(farmId)}/harvest-outlook`)).json();
        if (!current()) return;
        outlook.dataset.forecastRunId=data.forecast_run_id || '';
        if (!data.zones?.length) outlook.textContent='預測資料更新中';
        for (const zone of data.zones || []) {
          const row=document.createElement('p');
          const scope=(zone.row_codes || []).join('、');
          row.textContent=scope+'｜'+(zone.status==='ready' ? '預估採收 '+zone.predicted_harvest_window.replace('..','–') : '預測資料更新中');
          outlook.append(row);
        }
        const delivery=document.createElement('p');delivery.textContent=data.delivery?.message || '尚無配送資料';outlook.append(delivery);
        for(const batch of data.delivery?.batches || []) {
          const item=document.createElement('p');
          item.textContent=batch.on_hold?'此批次配送暫停':batch.ship_window_start?'預計出貨 '+fmtDate(batch.ship_window_start)+(batch.ship_window_end?'–'+fmtDate(batch.ship_window_end):''):'出貨日期尚未建立';
          outlook.append(item);
          for(const shipment of batch.shipments || []){
            const line=document.createElement('p');
            line.textContent=(shipment.shipped_at?'已出貨 '+fmtDate(shipment.shipped_at):'已建立出貨紀錄')+'｜'+(shipment.carrier || '')+' '+(shipment.tracking_no || '單號尚未建立');
            outlook.append(line);
          }
        }
      } catch(error) {
        if(current()) { outlook.removeAttribute('data-forecast-run-id'); outlook.textContent=error.message==='403'?'目前沒有收成資訊檢視權限。':'預測資料暫時無法載入，請稍後重試。'; }
      }
    };
    const updatesTask = async () => {
      try {
        const updates=await(await read(`/api/customer/farms/${encodeURIComponent(farmId)}/updates`)).json();
        if(!current())return;
        document.getElementById('farmUpdateBody').textContent=updates[0]?.update_text || '尚無近況更新。';
        const record=document.getElementById('growthRecordBody');record.replaceChildren();
        for(const u of updates){const p=document.createElement('p');p.textContent=u.update_text+' '+fmtDate(u.published_at);record.append(p);}
      } catch { if(current()) document.getElementById('farmUpdateBody').textContent='近況暫時無法載入。'; }
    };
    const offersTask = async () => {
      const card = document.getElementById('adoptionOfferCard');
      const body = document.getElementById('adoptionOfferBody');
      try {
        const offers = await (await read('/api/customer/adoption-offers')).json();
        if (!current()) return;
        body.replaceChildren();
        const relevant = offers.filter(o => o.status === 'offered' || (o.status === 'accepted' && o.shipment_id));
        if (relevant.length === 0) { card.style.display = 'none'; return; }
        card.style.display = '';
        for (const offer of relevant) {
          const row = document.createElement('div');
          row.className = 'wg-offer-row';
          const text = document.createElement('p');
          text.textContent = `${offer.farm_name}｜可分配數量 ${offer.allocated_quantity}`;
          if (offer.status === 'offered') {
            const shipBtn = document.createElement('button'); shipBtn.textContent = '要寄';
            const skipBtn = document.createElement('button'); skipBtn.textContent = '這次不寄';
            shipBtn.addEventListener('click', () => respondOffer(offer.offer_id, 'accept', row));
            skipBtn.addEventListener('click', () => respondOffer(offer.offer_id, 'decline', row));
            row.append(text, shipBtn, skipBtn);
          } else {
            const viewBtn = document.createElement('button'); viewBtn.textContent = '查看寄送狀態';
            viewBtn.addEventListener('click', () => openShipmentPanel(offer.shipment_id));
            row.append(text, viewBtn);
          }
          body.append(row);
        }
      } catch {
        if (current()) { card.style.display = 'none'; }
      }
    };
    async function respondOffer(offerId, decision, rowEl) {
      try {
        const res = await apiFetch(`/api/customer/adoption-offers/${encodeURIComponent(offerId)}/respond`, {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({decision}),
        });
        if (!res.ok) throw new Error(String(res.status));
        const result = await res.json();
        if (decision === 'accept' && result.shipment_id) {
          openShipmentPanel(result.shipment_id);
          loadLiveTab();
        } else {
          rowEl.textContent = '已記錄這次不寄送。';
        }
      } catch {
        rowEl.querySelector('p').textContent += '（送出失敗，請重試）';
      }
    }

    // ── 私密寄送確認頁（地址/運費/付款/物流）────────────────────────
    async function openShipmentPanel(shipmentId) {
      const modal = document.getElementById('shipmentModal');
      const body = document.getElementById('shipmentModalBody');
      modal.style.display = 'flex';
      body.textContent = '載入中…';
      await renderShipmentPanel(shipmentId);
    }
    function closeShipmentPanel() { document.getElementById('shipmentModal').style.display = 'none'; }

    async function renderShipmentPanel(shipmentId) {
      const body = document.getElementById('shipmentModalBody');
      let s;
      try {
        s = await (await apiFetch(`/api/customer/adoption-shipments/${encodeURIComponent(shipmentId)}`)).json();
      } catch { body.textContent = '讀取失敗，請重試。'; return; }
      body.replaceChildren();

      const qty = document.createElement('p'); qty.textContent = `數量：${s.quantity}`; body.append(qty);

      if (['pending_address','awaiting_fee_quote','fee_quoted'].includes(s.status)) {
        const form = document.createElement('div');
        const nameInput = document.createElement('input'); nameInput.placeholder = '收件人姓名'; nameInput.value = s.recipient_name || '';
        const phoneInput = document.createElement('input'); phoneInput.placeholder = '收件人電話'; phoneInput.value = s.recipient_phone || '';
        const addrInput = document.createElement('textarea'); addrInput.placeholder = '收件地址'; addrInput.value = s.address || '';
        [nameInput, phoneInput, addrInput].forEach(el => { el.className = 'wg-ship-input'; form.append(el); });
        const saveBtn = document.createElement('button'); saveBtn.textContent = '確認收件資料';
        saveBtn.addEventListener('click', async () => {
          try {
            const res = await apiFetch(`/api/customer/adoption-shipments/${encodeURIComponent(shipmentId)}/address`, {
              method: 'POST', headers: {'Content-Type':'application/json'},
              body: JSON.stringify({recipient_name: nameInput.value, recipient_phone: phoneInput.value, address: addrInput.value}),
            });
            if (!res.ok) throw new Error(String(res.status));
            await renderShipmentPanel(shipmentId);
          } catch { ElMessageFallback('送出失敗，請確認資料後重試。'); }
        });
        form.append(saveBtn);
        body.append(form);

        const feeP = document.createElement('p');
        feeP.textContent = s.shipping_fee_twd == null ? '運費：待農場報價，報價前不會收款，不代表免費。' : `運費：NT$ ${s.shipping_fee_twd}`;
        body.append(feeP);

        if (s.status === 'fee_quoted') {
          const uploadLabel = document.createElement('p'); uploadLabel.textContent = '運費已確定，請完成匯款後上傳憑證：'; body.append(uploadLabel);
          const fileInput = document.createElement('input'); fileInput.type = 'file'; fileInput.accept = 'image/*,application/pdf';
          const submitBtn = document.createElement('button'); submitBtn.textContent = '上傳付款憑證';
          submitBtn.addEventListener('click', async () => {
            if (!fileInput.files[0]) { ElMessageFallback('請先選擇檔案'); return; }
            const fd = new FormData(); fd.append('file', fileInput.files[0]);
            try {
              const res = await apiFetch(`/api/customer/adoption-shipments/${encodeURIComponent(shipmentId)}/payment-proof?consent_version=${s.consent_version}`, {
                method: 'POST', body: fd,
              });
              if (!res.ok) {
                if (res.status === 409) { ElMessageFallback('運費剛被更新，請重新確認後再上傳一次。'); await renderShipmentPanel(shipmentId); return; }
                throw new Error(String(res.status));
              }
              await renderShipmentPanel(shipmentId);
            } catch { ElMessageFallback('上傳失敗，請重試。'); }
          });
          body.append(fileInput, submitBtn);
        }
      } else if (s.status === 'payment_submitted') {
        const p = document.createElement('p'); p.textContent = '付款憑證已送出，待人工核對，核對後會更新狀態。'; body.append(p);
      } else if (s.status === 'payment_verified') {
        const p = document.createElement('p'); p.textContent = '已核款，農場準備包裝中。'; body.append(p);
      } else if (s.status === 'packed') {
        const p = document.createElement('p'); p.textContent = '已包裝，準備交寄。'; body.append(p);
      } else if (s.status === 'shipped') {
        const p = document.createElement('p'); p.textContent = `已交寄｜${s.logistics_carrier || ''} ${s.tracking_no || ''}`; body.append(p);
        const issueBtn = document.createElement('button'); issueBtn.textContent = '收貨有問題';
        issueBtn.addEventListener('click', async () => {
          const note = prompt('請描述收貨問題：');
          if (!note) return;
          try {
            const res = await apiFetch(`/api/customer/adoption-shipments/${encodeURIComponent(shipmentId)}/report-issue`, {
              method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({note}),
            });
            if (!res.ok) throw new Error(String(res.status));
            await renderShipmentPanel(shipmentId);
          } catch { ElMessageFallback('回報失敗，請重試。'); }
        });
        body.append(issueBtn);
      } else if (s.status === 'issue_reported') {
        const p = document.createElement('p'); p.textContent = `已回報問題：${s.issue_note || ''}（農場將盡快聯繫處理）`; body.append(p);
      }

      const closeBtn = document.createElement('button'); closeBtn.textContent = '關閉'; closeBtn.className = 'wg-ship-close'; closeBtn.addEventListener('click', closeShipmentPanel);
      body.append(closeBtn);
    }
    function ElMessageFallback(text) { alert(text); }
    await Promise.allSettled([photoTask(),harvestTask(),updatesTask(),loadFarmLayoutMap(farmId),offersTask()]);
  }
  setInterval(()=>{if(!document.hidden && currentFarmId && getToken() && !document.getElementById('tabLive').classList.contains('hidden'))loadLiveTab();},300000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden && currentFarmId && getToken())loadLiveTab();});
  window.addEventListener('storage',event=>{if(event.key===TOKEN_KEY){liveRequest++;liveAbort?.abort();clearLivePhoto();document.getElementById('liveHeroWrap').replaceChildren();document.getElementById('harvestOutlookBody').replaceChildren();location.reload();}});


  // ==================== 認養位置地圖 ====================
  // 改為靜態參考圖（WeGrow | 溫室認養現場平面圖 v0.2），不再即時標示個別客戶的認養排；
  // 2026-10-14 依需求從互動式SVG地圖（依真實排座標動態算圖例/走道/入口）簡化為單張圖片。
  function loadFarmLayoutMap(farmId) {
    const card = document.getElementById("layoutMapCard");
    const body = document.getElementById("layoutMapBody");
    if (!farmId) { card.classList.add("hidden"); return; }
    card.classList.remove("hidden");
    body.innerHTML = `
      <h3>溫室認養現場平面圖</h3>
      <img src="farm-layout-reference.png" alt="WeGrow 溫室認養現場平面圖：32排品字架、6個管理分區、入口視角定位" style="width:100%;height:auto;border-radius:8px;display:block;">
    `;
  }

  function openLightbox(url) {
    document.getElementById("lightboxImg").src = url;
    document.getElementById("lightbox").classList.remove("hidden");
  }
  document.getElementById("lightboxClose").addEventListener("click", () => document.getElementById("lightbox").classList.add("hidden"));
  document.getElementById("lightbox").addEventListener("click", (e) => { if (e.target.id === "lightbox") document.getElementById("lightbox").classList.add("hidden"); });

  // ---- tabs ----
  function switchTab(tab) {
    ["live", "activities", "esg"].forEach(t => {
      document.getElementById("tab" + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle("hidden", t !== tab);
    });
    document.querySelectorAll("[data-tab]").forEach(btn => btn.classList.toggle("active", btn.getAttribute("data-tab") === tab));
  }
  document.querySelectorAll("[data-tab]").forEach(btn => btn.addEventListener("click", () => switchTab(btn.getAttribute("data-tab"))));

  // ---- 活動回憶 ----
  async function loadActivities() {
    const resp = await apiFetch("/api/customer/activities");
    const body = document.getElementById("activityListBody");
    if (!resp.ok) { body.innerHTML = `<p class="empty-note">目前沒有可查看的活動。</p>`; return; }
    const data = await resp.json();
    if (!data.items.length) { body.innerHTML = `<p class="empty-note">目前沒有可查看的活動。</p>`; return; }
    body.innerHTML = data.items.map(a => `
      <div class="activity-item" data-id="${a.id}">
        ${a.cover_asset_id ? `<img data-cover-activity="${a.id}" data-cover-asset="${a.cover_asset_id}">` : `<div style="width:84px;height:60px;border-radius:8px;background:var(--mist);flex:0 0 auto;"></div>`}
        <div class="info"><strong>${escapeHtml(a.title)}</strong><div>${fmtDate(a.event_date)}</div></div>
      </div>`).join("");
    body.querySelectorAll(".activity-item").forEach(el => el.addEventListener("click", () => openActivityDetail(el.getAttribute("data-id"))));
    body.querySelectorAll("img[data-cover-activity]").forEach(img => {
      loadAuthedImage(`/api/customer/activities/${img.getAttribute("data-cover-activity")}/assets/${img.getAttribute("data-cover-asset")}/image`, img, () => { img.style.visibility = "hidden"; });
    });
  }

  async function openActivityDetail(activityId) {
    const resp = await apiFetch(`/api/customer/activities/${activityId}`);
    if (!resp.ok) return;
    const a = await resp.json();
    document.getElementById("activityListCard").classList.add("hidden");
    document.getElementById("activityDetailCard").classList.remove("hidden");
    document.getElementById("activityDetailTitle").textContent = a.title;
    document.getElementById("activityDetailMeta").textContent = fmtDate(a.event_date);
    document.getElementById("activityDetailDesc").textContent = a.description || "";
    const photos = a.assets.filter(x => x.kind === "photo");
    const attachments = a.assets.filter(x => x.kind === "attachment");
    const galleryEl = document.getElementById("activityGallery");
    galleryEl.innerHTML = photos.map(p => `<img data-asset="${p.id}">`).join("");
    galleryEl.querySelectorAll("img").forEach(img => {
      const assetId = img.getAttribute("data-asset");
      loadAuthedImage(`/api/customer/activities/${activityId}/assets/${assetId}/image`, img, () => { img.style.visibility = "hidden"; });
      img.addEventListener("click", () => img.src && openLightbox(img.src));
    });
    const attBody = document.getElementById("activityAttachments");
    attBody.innerHTML = attachments.length
      ? attachments.map(att => `<div style="margin-bottom:6px;"><button data-asset="${att.id}" data-name="${escapeHtml(att.original_name || '活動資料')}" style="background:none;border:none;color:var(--green);font-weight:700;font-size:13px;padding:0;">📎 ${escapeHtml(att.original_name || '下載活動資料')}</button></div>`).join("")
      : "";
    attBody.querySelectorAll("button[data-asset]").forEach(btn => btn.addEventListener("click", () => {
      triggerAuthedDownload(`/api/customer/activities/${activityId}/assets/${btn.getAttribute("data-asset")}/download`, btn.getAttribute("data-name"));
    }));
  }
  document.getElementById("activityBackLink").addEventListener("click", () => {
    document.getElementById("activityDetailCard").classList.add("hidden");
    document.getElementById("activityListCard").classList.remove("hidden");
  });

  // ---- ESG ----
  async function loadEsgDocuments() {
    const resp = await apiFetch("/api/customer/esg-documents");
    const body = document.getElementById("esgListBody");
    if (!resp.ok) { body.innerHTML = `<p class="empty-note">本期資料整理中。</p>`; return; }
    const docs = await resp.json();
    if (!docs.length) { body.innerHTML = `<p class="empty-note">本期資料整理中。</p>`; return; }
    const categoryLabel = { outcome_report: "成果報告", activity_evidence: "活動佐證", farm_record: "場域紀錄", other: "其他附件" };
    body.innerHTML = docs.map(d => `
      <div class="esg-item">
        <div class="info">
          <strong>${escapeHtml(d.title)}</strong>
          <div>${categoryLabel[d.category] || d.category}｜${d.period_year}年度｜${escapeHtml(d.version_label)}</div>
        </div>
        <button data-doc="${d.id}" data-name="${escapeHtml(d.title)}.pdf">下載 ESG 資料</button>
      </div>`).join("");
    body.querySelectorAll("button[data-doc]").forEach(btn => btn.addEventListener("click", () => {
      triggerAuthedDownload(`/api/customer/esg-documents/${btn.getAttribute("data-doc")}/download`, btn.getAttribute("data-name"));
    }));
  }

  document.getElementById("logoutBtn").addEventListener("click", () => { setToken(""); location.reload(); });

  if (getToken()) {
    showRestoring();
    afterLogin().catch(() => {
      setToken("");
      showLoginCard("連線發生問題，請重新登入。");
    });
  }
})();
</script>
