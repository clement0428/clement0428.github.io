<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的採購批次｜WeGrow Orbit</title>
<meta name="description" content="SOL×WeGrow 企業採購批次寄送：企業採購窗口查詢批次進度、確認報價、回報付款。">
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --paper: #fbfaf4; --panel: #ffffff; --ink: #1b1e1a; --muted: #5c6058;
    --line: #dedbd0; --brand: #E2CF35; --brand-ink: #4a4310;
    --danger: #b3261e; --success: #1b5e20; --shadow: 0 18px 50px rgba(20,20,15,.10);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Noto Sans TC","Helvetica Neue",Arial,sans-serif; background:var(--paper); color:var(--ink); }
  header { background:#333; color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; }
  header b { color: var(--brand); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:18px; box-shadow: var(--shadow); }
  h1 { font-size: 18px; margin:0; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  h3 { font-size: 13px; margin: 20px 0 8px; color: var(--muted); }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input { width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line); font-size:14px; margin-bottom:12px; }
  button { cursor:pointer; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; }
  button.primary { background:var(--brand); color:var(--brand-ink); }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); }
  button.small { padding:5px 10px; font-size:12px; }
  .status { font-size:13px; margin: 6px 0 14px; }
  .status.error { color: var(--danger); }
  .status.success { color: var(--success); }
  table { width:100%; border-collapse: collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .batch-row { cursor:pointer; }
  .batch-row:hover { background: #faf8ee; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; background:#eee; }
  .hidden { display:none; }
  .comment { border-left:2px solid var(--brand); padding:6px 10px; margin-bottom:8px; font-size:13px; background:#fbfaf4; }
  .back-link { cursor:pointer; color:var(--muted); font-size:13px; margin-bottom:10px; display:inline-block; }
</style>
</head>
<body>

<header>
  <h1>我的採購批次 ｜ <b>WeGrow Orbit</b></h1>
  <div id="headerRight"></div>
</header>

<main>
  <section class="card" id="loginCard">
    <h2>企業採購窗口登入</h2>
    <p style="font-size:12px;color:var(--muted);margin:0 0 14px;">請用威果管理員開通的帳號登入，只會看到您企業自己的批次。這不是Demo，會實際呼叫 WeGrow Orbit 後端。</p>
    <form id="loginForm">
      <label>帳號 Email</label>
      <input type="email" id="loginEmail" autocomplete="username" required>
      <label>密碼</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
      <button type="submit" class="primary">登入</button>
    </form>
    <p class="status" id="loginStatus"></p>
  </section>

  <section class="card hidden" id="batchListCard">
    <h2>我的批次<button class="ghost small" style="float:right" onclick="logout()">登出</button></h2>
    <table>
      <thead><tr><th>批次名稱</th><th>狀態</th><th></th></tr></thead>
      <tbody id="batchListBody"></tbody>
    </table>
    <p class="status" id="batchListStatus"></p>
  </section>

  <section class="card hidden" id="batchDetailCard">
    <span class="back-link" onclick="showBatchList()">← 返回批次列表</span>
    <h2 id="batchDetailTitle"></h2>
    <p id="batchStatusTag"></p>

    <h3>商品品項</h3>
    <table><thead><tr><th>SKU</th><th>品名</th><th>數量</th><th>單位</th></tr></thead><tbody id="itemsBody"></tbody></table>

    <h3>名單版本</h3>
    <table>
      <thead><tr><th>版本</th><th>狀態</th><th>收件人數</th><th>操作</th></tr></thead>
      <tbody id="revisionsBody"></tbody>
    </table>
    <div id="revisionDetailPanel" class="hidden" style="margin:10px 0 20px;padding:14px 16px;background:#fbfaf4;border:1px solid var(--line);border-radius:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <strong style="font-size:13px;" id="revisionDetailTitle"></strong>
        <button class="ghost small" onclick="window.__closeRevisionDetail()">收合</button>
      </div>
      <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">請核對每一位收件人的姓名、地址與品項數量無誤後再確認，確認後名單即鎖定寄送依據。</p>
      <div id="revisionDetailRecipients"></div>
      <button class="primary small" id="revisionDetailConfirmBtn" style="margin-top:10px;">我已核對，確認此版本</button>
    </div>

    <h3>出貨進度／物流單號</h3>
    <div id="shipmentsBody"></div>

    <h3>報價</h3>
    <div id="quotesBody"></div>

    <h3>付款狀態（人工核實，上傳回報不會自動變成已付款）</h3>
    <div id="receivablesBody"></div>
    <form id="paymentReportForm" class="hidden">
      <label>回報金額</label>
      <input type="number" id="paymentAmount" required>
      <label>末四碼</label>
      <input type="text" id="paymentLast4" maxlength="4">
      <input type="hidden" id="paymentReceivableId">
      <button type="submit" class="primary small">送出付款回報</button>
    </form>
    <p class="status" id="paymentStatus"></p>

    <h3>留言</h3>
    <div id="commentsBody"></div>
    <form id="commentForm">
      <input type="text" id="commentInput" placeholder="輸入留言...">
      <button type="submit" class="ghost small">送出留言</button>
    </form>
  </section>
</main>

<script>
(function () {
  const API_BASE = window.PROCUREMENT_CUSTOMER_API_BASE || "https://api.wegrow-orbit.com";
  const TOKEN_KEY = "procurement-customer-token";
  const STATUS_LABEL = {
    draft: "草稿", quoted: "已報價", payment_pending: "待付款", payment_verified: "付款已核實",
    production_released: "製作已放行", shipping: "出貨中", completed: "已完成", cancelled: "已取消",
  };
  const i18n = {
    loginFailed: "登入失敗：Email 或密碼錯誤。",
    passwordChangeRequired: "首次登入必須更換密碼才能繼續，請聯絡威果協助處理。",
    noMembership: "此帳號尚未被開通任何企業會籍，請聯絡威果確認採購狀態。",
    networkError: "無法連線到 WeGrow Orbit 後端，請稍後再試。",
    noBatches: "目前沒有批次。",
  };

  function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
  function setToken(t) { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }
  async function apiFetch(path, options) {
    const headers = Object.assign({}, (options && options.headers) || {}, { Authorization: `Bearer ${getToken()}` });
    return fetch(`${API_BASE}${path}`, Object.assign({}, options, { headers }));
  }
  function show(id) { document.getElementById(id).classList.remove("hidden"); }
  function hide(id) { document.getElementById(id).classList.add("hidden"); }
  function setStatus(id, text, cls) {
    const el = document.getElementById(id);
    el.textContent = text || "";
    el.className = "status" + (cls ? " " + cls : "");
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    setStatus("loginStatus", "登入中…");
    let resp;
    try {
      const body = new URLSearchParams({ username: email, password });
      resp = await fetch(`${API_BASE}/auth/login`, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString() });
    } catch { setStatus("loginStatus", i18n.networkError, "error"); return; }
    if (!resp.ok) { setStatus("loginStatus", i18n.loginFailed, "error"); return; }
    const result = await resp.json();
    setToken(result.access_token);
    document.getElementById("headerRight").textContent = email;
    hide("loginCard");
    await loadBatches();
  });

  async function loadBatches() {
    let resp;
    try { resp = await apiFetch("/api/procurement/batches"); }
    catch { setStatus("batchListStatus", i18n.networkError, "error"); show("batchListCard"); return; }

    if (resp.status === 401) { setToken(""); location.reload(); return; }
    if (resp.status === 403) {
      const body = await resp.json().catch(() => ({}));
      setStatus("batchListStatus", body.detail === "password_change_required" ? i18n.passwordChangeRequired : i18n.noMembership, "error");
      show("batchListCard");
      return;
    }
    if (!resp.ok) { setStatus("batchListStatus", i18n.networkError, "error"); show("batchListCard"); return; }

    const batches = await resp.json();
    show("batchListCard");
    const tbody = document.getElementById("batchListBody");
    tbody.innerHTML = "";
    if (!batches.length) { setStatus("batchListStatus", i18n.noBatches); return; }
    setStatus("batchListStatus", "");
    batches.forEach((b) => {
      const tr = document.createElement("tr");
      tr.className = "batch-row";
      tr.innerHTML = `<td>${escapeHtml(b.name)}</td><td><span class="tag">${escapeHtml(STATUS_LABEL[b.status] || b.status)}</span></td><td>開啟 →</td>`;
      tr.addEventListener("click", () => openBatch(b.id, b.name));
      tbody.appendChild(tr);
    });
  }

  function showBatchList() { hide("batchDetailCard"); show("batchListCard"); }

  let currentBatchId = null;

  async function openBatch(batchId, name) {
    currentBatchId = batchId;
    hide("batchListCard");
    show("batchDetailCard");
    document.getElementById("batchDetailTitle").textContent = name;
    await Promise.all([loadBatchDetail(batchId), loadQuotes(batchId), loadReceivables(batchId), loadComments(batchId)]);
  }

  async function loadBatchDetail(batchId) {
    const resp = await apiFetch(`/api/procurement/batches/${batchId}`);
    if (!resp.ok) return;
    const data = await resp.json();
    document.getElementById("batchStatusTag").innerHTML = `<span class="tag">${escapeHtml(STATUS_LABEL[data.status] || data.status)}</span>`;

    const itemsBody = document.getElementById("itemsBody");
    itemsBody.innerHTML = data.items.map(i => `<tr><td>${escapeHtml(i.sku_code)}</td><td>${escapeHtml(i.sku_name)}</td><td>${i.quantity}</td><td>${escapeHtml(i.unit)}</td></tr>`).join("");

    const revisionsBody = document.getElementById("revisionsBody");
    revisionsBody.innerHTML = data.recipient_revisions.map(r => `
      <tr>
        <td>${r.version}</td>
        <td><span class="tag">${r.status === "confirmed" ? "已確認" : "草稿"}</span></td>
        <td>${r.recipient_count}</td>
        <td>${r.status !== "confirmed" ? `<button class="ghost small" onclick="window.__viewRevisionDetail('${r.id}', ${r.version})">查看明細並確認</button>` : ""}</td>
      </tr>`).join("");
    await loadShipments(batchId);
  }

  // 2026-09-22 Clement review：企業窗口原本按版本號旁邊的按鈕就能直接確認，完全看不到
  // 實際收件人姓名/地址/品項/數量。改成必須先打開明細面板、看到真實收件人清單後，
  // 確認按鈕才在這個面板裡出現——不能再靠版本號+人數就盲目按確認。
  window.__viewRevisionDetail = async function (revisionId, version) {
    const resp = await apiFetch(`/api/procurement/batches/${currentBatchId}/recipient-revisions/${revisionId}`);
    if (!resp.ok) return;
    const data = await resp.json();
    document.getElementById("revisionDetailTitle").textContent = `第 ${version} 版名單明細（共 ${data.recipients.length} 位收件人）`;
    const el = document.getElementById("revisionDetailRecipients");
    el.innerHTML = data.recipients.map(r => `
      <div style="margin-bottom:10px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;">
        <div><strong>${escapeHtml(r.name)}</strong>　${escapeHtml(r.phone || "")}</div>
        <div style="font-size:12px;color:var(--muted);">${escapeHtml(r.postal_code || "")} ${escapeHtml(r.address || "")}</div>
        <table style="margin-top:6px;"><thead><tr><th>品項</th><th>數量</th></tr></thead><tbody>
          ${r.allocations.map(a => `<tr><td>${escapeHtml(a.sku_name || a.sku_code || a.batch_item_id)}</td><td>${a.quantity} ${escapeHtml(a.unit || "")}</td></tr>`).join("") || "<tr><td colspan='2' style='color:var(--muted)'>尚未分配品項</td></tr>"}
        </tbody></table>
      </div>`).join("");
    document.getElementById("revisionDetailConfirmBtn").onclick = () => window.__confirmRevision(revisionId);
    show("revisionDetailPanel");
  };

  window.__closeRevisionDetail = function () { hide("revisionDetailPanel"); };

  window.__confirmRevision = async function (revisionId) {
    const resp = await apiFetch(`/api/procurement/batches/${currentBatchId}/recipient-revisions/${revisionId}/confirm`, { method: "POST" });
    if (resp.ok) {
      hide("revisionDetailPanel");
      await loadBatchDetail(currentBatchId);
    }
  };

  async function loadShipments(batchId) {
    const resp = await apiFetch(`/api/procurement/batches/${batchId}/shipments`);
    const el = document.getElementById("shipmentsBody");
    if (!resp.ok) { el.innerHTML = ""; return; }
    const shipments = await resp.json();
    el.innerHTML = shipments.length
      ? `<table><thead><tr><th>收件人</th><th>物流單號</th><th>貨運商</th><th>出貨時間</th></tr></thead><tbody>
          ${shipments.map(s => `<tr><td>${escapeHtml(s.recipient_name || "")}</td><td>${escapeHtml(s.tracking_no || "尚未產生單號")}</td><td>${escapeHtml(s.logistics_carrier || "")}</td><td>${s.shipped_at ? new Date(s.shipped_at).toLocaleString("zh-TW", { timeZone: "Asia/Taipei" }) : ""}</td></tr>`).join("")}
        </tbody></table>`
      : `<p style="font-size:12px;color:var(--muted);">尚未有出貨紀錄。</p>`;
  }

  async function loadQuotes(batchId) {
    const resp = await apiFetch(`/api/procurement/batches/${batchId}/quotes`);
    const el = document.getElementById("quotesBody");
    if (!resp.ok) { el.innerHTML = "<p style='font-size:12px;color:var(--muted)'>尚無報價</p>"; return; }
    const quotes = await resp.json();
    el.innerHTML = quotes.length ? quotes.map(q => `
      <div style="margin-bottom:8px;padding:8px 10px;background:#fbfaf4;border-radius:8px;">
        <strong>${q.payer === "four_leaf" ? "四葉主約款" : "威果客製費"}</strong> v${q.version} — NT$ ${q.total.toLocaleString()}
        ${q.confirmed_at ? `<span class="tag">已確認</span>` : `<button class="ghost small" onclick="window.__acceptQuote('${q.id}')">確認此報價</button>`}
      </div>`).join("") : "<p style='font-size:12px;color:var(--muted)'>尚無報價</p>";
  }

  window.__acceptQuote = async function (quoteId) {
    const resp = await apiFetch(`/api/procurement/batches/${currentBatchId}/quotes/${quoteId}/accept`, { method: "POST" });
    if (resp.ok) await loadQuotes(currentBatchId);
  };

  async function loadReceivables(batchId) {
    const resp = await apiFetch(`/api/procurement/batches/${batchId}/payment-instructions`);
    const el = document.getElementById("receivablesBody");
    if (!resp.ok) { el.innerHTML = ""; return; }
    const receivables = await resp.json();
    el.innerHTML = receivables.map(r => `
      <div style="margin-bottom:8px;padding:8px 10px;background:#fbfaf4;border-radius:8px;">
        ${r.payer === "four_leaf" ? "四葉主約款" : "威果客製費"}：應收 NT$ ${r.amount_due.toLocaleString()}，已核實 NT$ ${r.amount_verified.toLocaleString()}
        <span class="tag">${r.status === "verified" ? "已全額核實" : (r.status === "partial" ? "部分核實" : "尚未付款")}</span>
        ${r.status !== "verified" ? `<button class="ghost small" onclick="window.__openPaymentForm('${r.id}')">回報付款</button>` : ""}
      </div>`).join("");
  }

  window.__openPaymentForm = function (receivableId) {
    document.getElementById("paymentReceivableId").value = receivableId;
    show("paymentReportForm");
    document.getElementById("paymentReportForm").classList.remove("hidden");
  };

  document.getElementById("paymentReportForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const receivableId = document.getElementById("paymentReceivableId").value;
    const amount = Number(document.getElementById("paymentAmount").value);
    const last4 = document.getElementById("paymentLast4").value.trim();
    setStatus("paymentStatus", "送出中…");
    const resp = await apiFetch(`/api/procurement/receivables/${receivableId}/payment-reports`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ reported_amount: amount, reported_date: new Date().toISOString(), reference_last4: last4 }),
    });
    if (!resp.ok) { setStatus("paymentStatus", "送出失敗", "error"); return; }
    setStatus("paymentStatus", "已送出付款回報，待威果財務人工核實（此步驟不會自動變成已付款）", "success");
    await loadReceivables(currentBatchId);
  });

  async function loadComments(batchId) {
    const resp = await apiFetch(`/api/procurement/batches/${batchId}/comments`);
    const el = document.getElementById("commentsBody");
    if (!resp.ok) { el.innerHTML = ""; return; }
    const comments = await resp.json();
    el.innerHTML = comments.length
      ? comments.map(c => `<div class="comment">${escapeHtml(c.body)}<div style="font-size:11px;color:var(--muted);margin-top:3px;">${new Date(c.created_at).toLocaleString("zh-TW", { timeZone: "Asia/Taipei" })}</div></div>`).join("")
      : `<p style="font-size:12px;color:var(--muted);">尚無留言</p>`;
  }

  document.getElementById("commentForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("commentInput");
    const body = input.value.trim();
    if (!body) return;
    await apiFetch(`/api/procurement/batches/${currentBatchId}/comments`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ body }),
    });
    input.value = "";
    await loadComments(currentBatchId);
  });

  window.logout = function () { setToken(""); location.reload(); };
  window.showBatchList = showBatchList;

  if (getToken()) { hide("loginCard"); loadBatches(); }
})();
</script>

</body>
</html>
