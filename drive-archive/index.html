<h1>WeGrow Orbit — 照片 Drive 歸檔工具</h1>
<p>這是威果（WeGrow）內部管理系統「WeGrow Orbit」的一項功能：把企業認養客戶專區顯示的現場照片原圖，
額外保存一份到 Google Drive 指定資料夾，作為備援保存，不影響網站本身既有的照片顯示路徑（網站一律
透過自己的私有儲存供圖，Drive 只是第二份保存）。</p>
<p>這個頁面是 Google OAuth 應用程式所要求的「應用程式首頁」，供 Google 驗證本應用程式的身分與用途。</p>
<p>隱私權政策：<a href="/drive-archive/privacy.html">/drive-archive/privacy.html</a></p>
<p>本工具僅供威果內部管理人員使用，不對一般大眾開放。</p>
