<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeGrow 企業採購</title>
<meta name="description" content="企業草莓採購入口：供貨目錄、送出需求、查看進度。">
<meta name="build-version" content="20261025T2-b2b-buyer-batch3" data-testid="wegrow-build-stamp">
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --ink: #141713; --muted: #596258; --paper: #fbfaf4; --white: #ffffff;
    --line: #dfded4; --gold: #b68a35; --green: #153f2a; --mist: #eef1e8; --rose: #c84c41;
    --shadow: 0 24px 80px rgba(20, 23, 19, .13);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif; background:var(--paper); color:var(--ink); }
  a { color:inherit; text-decoration:none; }
  button { cursor:pointer; font-family:inherit; }
  .hidden { display:none !important; }

  header.topbar {
    position: sticky; top:0; z-index:20; background: var(--white);
    border-bottom: 1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 20px;
  }
  .brand-name { font-size:16px; font-weight:800; }
  .brand-sub { font-size:11px; color:var(--muted); }
  .user-menu { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }
  .user-menu button { border:1px solid var(--line); border-radius:8px; padding:6px 12px; background:var(--white); font-size:13px; }

  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 80px; }
  .card { background: var(--white); border:1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  h2 { margin: 0 0 6px; font-size: 20px; }
  h3 { margin: 0 0 12px; font-size: 15px; }
  .muted-p { color: var(--muted); font-size: 13px; margin: 0 0 16px; }

  #loginCard { max-width: 420px; margin: 60px auto; padding: 28px; background: var(--white); border-radius: 16px; box-shadow: var(--shadow); }
  #loginCard label { display:block; font-size:12px; color:var(--muted); margin:14px 0 4px; }
  #loginCard input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .login-btn, .primary { background: var(--green); color:#fff; border:none; border-radius:8px; padding:11px 16px; font-size:14px; font-weight:700; width:100%; margin-top:16px; }
  .line-login-btn { background:#06C755; color:#fff; border:none; border-radius:8px; padding:11px 16px; font-size:14px; font-weight:700; width:100%; margin-top:10px; }
  .login-divider { text-align:center; color:var(--muted); font-size:12px; margin:16px 0 4px; }
  .status { font-size:13px; margin-top:10px; min-height:16px; }
  .status.error { color: var(--rose); }

  .offering-row, .request-row { padding:12px 0; border-bottom:1px solid var(--line); }
  .offering-row:last-child, .request-row:last-child { border-bottom:none; }
  .offering-row .title, .request-row .title { font-weight:700; font-size:14px; }
  .offering-row .meta, .request-row .meta { font-size:12px; color:var(--muted); margin-top:2px; }
  .offering-row button { margin-top:8px; border:1px solid var(--green); color:var(--green); background:#fff; border-radius:8px; padding:7px 14px; font-size:13px; }
  .status-pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:var(--mist); color:var(--green); margin-top:4px; }
  .secondary-link { display:block; margin-top:8px; border:1px solid var(--green); color:var(--green); background:#fff; border-radius:8px; padding:8px 12px; font-size:13px; width:100%; }
  .quote-box { margin-top:8px; background:var(--mist); border-radius:8px; padding:10px; }
  .quote-box select { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
  .status-pill.pending { background:#fff4e5; color:#8a4b00; }

  .empty-note { color: var(--muted); font-size: 13px; padding: 12px 0; }

  #requestModal { display:none; position:fixed; inset:0; background:rgba(20,23,19,.45); align-items:center; justify-content:center; z-index:30; padding:16px; }
  #requestModalBody { background:var(--white); border-radius:14px; padding:20px; max-width:420px; width:100%; max-height:85vh; overflow:auto; }
  #requestModalBody input, #requestModalBody textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; margin-top:6px; }
  #requestModalBody label { display:block; font-size:12px; color:var(--muted); margin-top:12px; }
</style>
</head>
<body>

<div id="sessionRestoring" style="max-width:420px;margin:60px auto;text-align:center;color:var(--muted);font-size:14px;padding:20px;">
  正在載入…
</div>

<div id="loginCard" class="hidden">
  <h2>企業採購登入</h2>
  <p class="muted-p" id="loginIntro">查看供貨、送出採購需求、追蹤進度。</p>
  <button class="line-login-btn" id="lineLoginBtn">用 LINE 登入</button>
  <div class="login-divider">或使用 Email</div>
  <form id="loginForm">
    <label>帳號 Email</label>
    <input type="email" id="loginEmail" autocomplete="username" required>
    <label>密碼</label>
    <input type="password" id="loginPassword" autocomplete="current-password" required>
    <button type="submit" class="primary">登入</button>
  </form>
  <p class="status" id="loginStatus"></p>
</div>

<div id="appShell" class="hidden">
  <header class="topbar">
    <div>
      <div class="brand-name">WeGrow 企業採購</div>
      <div class="brand-sub" id="orgNameLabel"></div>
    </div>
    <div class="user-menu">
      <span id="userEmailLabel"></span>
      <button id="logoutBtn">登出</button>
    </div>
  </header>

  <main>
    <div class="card">
      <h3>供貨目錄</h3>
      <div id="catalogBody"><p class="empty-note">載入中…</p></div>
    </div>

    <div class="card">
      <h3>我的採購需求</h3>
      <div id="requestsBody"><p class="empty-note">載入中…</p></div>
    </div>
  </main>
</div>

<div id="requestModal">
  <div id="requestModalBody"></div>
</div>

<script>
(function () {
  const API_BASE = window.B2B_API_BASE || "https://api.wegrow-orbit.com";
  const TOKEN_KEY = "b2b_buyer_token";

  function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
  function setToken(t) { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }
  async function apiFetch(path, options) {
    const headers = Object.assign({}, (options && options.headers) || {}, { Authorization: `Bearer ${getToken()}` });
    return fetch(`${API_BASE}${path}`, Object.assign({}, options, { headers }));
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmtDate(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleDateString("zh-TW", { timeZone: "Asia/Taipei" });
  }
  function setStatus(id, text, cls) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = text || "";
    el.className = "status" + (cls ? " " + cls : "");
  }

  // 後端這批B2B路由(/api/b2b/*)是新的，部署受阻期間正式站上還沒有——那時候
  // 打這些API一定是404，跟「連線失敗」或「你沒有被邀請」是完全不同的原因，
  // 不能用同一句話含糊過去，否則買方會以為是自己的問題而放棄，而不是等
  // 部署完成後重新整理就好。
  const NOT_DEPLOYED_MESSAGE = "此功能即將上線，請稍後再試。您的登入與輸入內容都還保留著，不需要重新操作。";
  function isNotDeployedYet(resp) {
    return resp && resp.status === 404;
  }

  function showRestoring() {
    document.getElementById("sessionRestoring").classList.remove("hidden");
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("appShell").classList.add("hidden");
  }
  function showLoginCard(message) {
    document.getElementById("sessionRestoring").classList.add("hidden");
    document.getElementById("appShell").classList.add("hidden");
    document.getElementById("loginCard").classList.remove("hidden");
    if (message) setStatus("loginStatus", message, "error");
  }
  function showApp() {
    document.getElementById("sessionRestoring").classList.add("hidden");
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("appShell").classList.remove("hidden");
  }

  // 邀請連結帶的token——登入前後都要保留，登入成功的那一刻立刻兌換。
  const params = new URLSearchParams(window.location.search);
  const inviteToken = params.get("invite_token");
  if (inviteToken) {
    sessionStorage.setItem("b2b_pending_invite_token", inviteToken);
    document.getElementById("loginIntro").textContent = "您收到了企業採購邀請，登入後即可開始使用。";
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    setStatus("loginStatus", "登入中…");
    let resp;
    try {
      const body = new URLSearchParams({ username: email, password });
      resp = await fetch(`${API_BASE}/auth/login`, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString() });
    } catch { setStatus("loginStatus", "無法連線，請稍後再試。", "error"); return; }
    if (!resp.ok) { setStatus("loginStatus", "登入失敗：Email 或密碼錯誤。", "error"); return; }
    const result = await resp.json();
    setToken(result.access_token);
    await afterLogin();
  });

  document.getElementById("lineLoginBtn").addEventListener("click", () => {
    const redirectTo = "/b2b-buyer/";
    // return_mode=direct：這是獨立靜態頁，不是Orbit SPA，callback完要直接
    // 帶line_code導回這個頁面本身，不要經過SPA的/#/login。
    window.location.href = `${API_BASE}/api/auth/line/login-start?redirect_to=${encodeURIComponent(redirectTo)}&return_mode=direct`;
  });

  async function handleLineReturn() {
    const lineCode = params.get("line_code");
    const lineError = params.get("line_error");
    if (lineError) {
      showLoginCard("LINE登入失敗，請重試或改用Email。");
      history.replaceState(null, "", window.location.pathname);
      return true;
    }
    if (!lineCode) return false;
    try {
      const resp = await fetch(`${API_BASE}/api/auth/line/exchange`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: lineCode }),
      });
      if (!resp.ok) { showLoginCard("LINE登入失敗，請重試。"); return true; }
      const result = await resp.json();
      setToken(result.access_token);
      history.replaceState(null, "", window.location.pathname);
      await afterLogin();
    } catch { showLoginCard("無法連線，請稍後再試。"); }
    return true;
  }

  async function redeemPendingInviteIfAny() {
    const token = sessionStorage.getItem("b2b_pending_invite_token");
    if (!token) return { ok: true };
    const resp = await apiFetch(`/api/b2b/invites/${encodeURIComponent(token)}/redeem`, { method: "POST" });
    if (isNotDeployedYet(resp)) {
      // 功能還沒上線——邀請token留在sessionStorage，不要丟掉，等部署完成
      // 使用者重新整理這個頁面時還能自動繼續兌換，不需要業務再發一次連結。
      return { ok: false, notDeployed: true, message: NOT_DEPLOYED_MESSAGE };
    }
    sessionStorage.removeItem("b2b_pending_invite_token");
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      const messages = {
        invite_invalid: "邀請連結無效，請聯繫業務重新發送。",
        invite_already_used: "這個邀請連結已經被使用過了。",
        invite_expired: "邀請連結已過期，請聯繫業務重新發送。",
        user_already_in_another_organization: "這個帳號已經屬於另一家公司，無法再加入新的公司。",
      };
      return { ok: false, message: messages[body.detail] || "邀請兌換失敗，請聯繫業務協助。" };
    }
    return { ok: true };
  }

  async function afterLogin() {
    const redeemResult = await redeemPendingInviteIfAny();
    let meResp;
    try {
      meResp = await apiFetch("/api/b2b/me");
    } catch {
      setToken("");
      showLoginCard("無法連線，請檢查網路後重新登入。");
      return;
    }
    if (isNotDeployedYet(meResp) || redeemResult.notDeployed) {
      // 這裡故意不清token、不丟掉邀請連結——使用者已經登入成功，純粹是
      // B2B功能本身還沒上線，不是帳號或邀請有問題，不應該被導回登入頁
      // 重新操作一輪。
      showLoginCard(NOT_DEPLOYED_MESSAGE);
      return;
    }
    if (meResp.status === 401) { setToken(""); showLoginCard("登入已過期，請重新登入。"); return; }
    if (!meResp.ok) {
      setToken("");
      showLoginCard(redeemResult.ok ? "此帳號尚未被邀請加入任何企業採購窗口，請聯繫業務。" : redeemResult.message);
      return;
    }
    const me = await meResp.json();
    document.getElementById("orgNameLabel").textContent = me.organization ? me.organization.name : "";
    document.getElementById("userEmailLabel").textContent = me.user.email;
    showApp();
    loadCatalog();
    loadMyRequests();
  }

  async function loadCatalog() {
    const body = document.getElementById("catalogBody");
    body.textContent = "載入中…";
    try {
      const resp = await apiFetch("/api/b2b/supply-catalog");
      if (isNotDeployedYet(resp)) { body.innerHTML = `<p class="empty-note">${NOT_DEPLOYED_MESSAGE}</p>`; return; }
      if (!resp.ok) throw new Error(String(resp.status));
      const rows = await resp.json();
      if (!rows.length) { body.innerHTML = '<p class="empty-note">目前沒有公開的供貨公告，請直接聯繫業務詢問。</p>'; return; }
      body.innerHTML = "";
      for (const r of rows) {
        const row = document.createElement("div");
        row.className = "offering-row";
        const priceText = r.price_hint_twd == null ? "待報價" : `約 NT$${r.price_hint_twd}`;
        // is_reference_only=true代表這個數字還沒接上共用供應池(扣認養保留
        // 後的真正剩餘)，純粹是業務手動公告的參考值，不能講成「可訂量」
        // 讓買方以為已經保留庫存——只有接了supply_period_id才是真正剩餘量。
        const quantityLabel = r.is_reference_only
          ? `供貨參考 ${r.available_quantity}${escapeHtml(r.unit)}`
          : `尚餘 ${r.available_quantity}${escapeHtml(r.unit)}`;
        row.innerHTML = `
          <div class="title">${escapeHtml(r.crop_name)}</div>
          <div class="meta">${quantityLabel}｜${fmtDate(r.period_start)}～${fmtDate(r.period_end_exclusive)}｜${priceText}</div>
          ${r.is_reference_only ? '<div class="meta">僅供參考，實際供貨以業務確認為準，可直接提出需求詢問。</div>' : ""}
          ${r.notes ? `<div class="meta">${escapeHtml(r.notes)}</div>` : ""}
        `;
        const btn = document.createElement("button");
        btn.textContent = "送出採購需求";
        btn.addEventListener("click", () => openRequestModal(r));
        row.appendChild(btn);
        body.appendChild(row);
      }
    } catch {
      body.innerHTML = '<p class="empty-note">載入失敗，請重試。</p>';
    }
  }

  async function loadMyRequests() {
    const body = document.getElementById("requestsBody");
    body.textContent = "載入中…";
    try {
      const resp = await apiFetch("/api/b2b/purchase-requests");
      if (isNotDeployedYet(resp)) { body.innerHTML = `<p class="empty-note">${NOT_DEPLOYED_MESSAGE}</p>`; return; }
      if (!resp.ok) throw new Error(String(resp.status));
      const rows = await resp.json();
      if (!rows.length) { body.innerHTML = '<p class="empty-note">尚未送出任何採購需求。</p>'; return; }
      body.innerHTML = "";
      for (const r of rows) {
        const row = document.createElement("div");
        row.className = "request-row";
        row.id = `req-row-${r.id}`;
        // buyer_status_label是後端算好的——「已保存，待轉交」跟「業務已收到」
        // 是兩種不同狀態(推送成功與否)，不能用同一句話含糊過去。pending樣式
        // (橙色)只用在還沒推送成功的時候，推送成功後換成預設(綠色)樣式。
        const pillClass = (r.status === "submitted" && !r.pushed_to_sales) ? "status-pill pending" : "status-pill";
        row.innerHTML = `
          <div class="title">${escapeHtml(r.crop_name)}｜${r.requested_quantity}${escapeHtml(r.unit)}</div>
          <div class="meta">${fmtDate(r.created_at)}${r.desired_date ? "｜盼交期 " + fmtDate(r.desired_date) : ""}</div>
          <span class="${pillClass}">${escapeHtml(r.buyer_status_label || r.status)}</span>
          <div id="req-detail-${r.id}"></div>
        `;
        body.appendChild(row);
        renderRequestDetail(r);
      }
    } catch {
      body.innerHTML = '<p class="empty-note">載入失敗，請重試。</p>';
    }
  }

  function renderRequestDetail(r) {
    const detail = document.getElementById(`req-detail-${r.id}`);
    if (!detail) return;
    if (r.status === "quoted") {
      // B04報價 → B05確認/拒絕——舊報價被背景蓋掉的話quote_version會不一樣，
      // 送出時後端會核對，不是只靠前端擋。
      detail.innerHTML = `
        <div class="quote-box">
          <div>單價 NT$${r.quote_unit_price_twd ?? "-"} ／ 總價 NT$${r.quote_total_price_twd ?? "-"}</div>
          ${r.quote_terms ? `<div class="meta">條件：${escapeHtml(r.quote_terms)}</div>` : ""}
          ${r.quote_expires_at ? `<div class="meta">報價效期至 ${fmtDate(r.quote_expires_at)}</div>` : ""}
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="primary" style="margin:0" onclick="decideQuote('${r.id}', '${r.sales_quote_version}', true, this)">確認接受</button>
            <button style="margin:0;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:11px" onclick="decideQuote('${r.id}', '${r.sales_quote_version}', false, this)">拒絕</button>
          </div>
          <p class="status" id="decide-status-${r.id}"></p>
        </div>`;
    } else if (r.status === "accepted") {
      detail.innerHTML = `<button class="secondary-link" onclick="loadRequestExtras('${r.id}')">查看交貨/付款狀態、回報問題</button>
        <div id="req-extras-${r.id}"></div>`;
    } else if (r.status === "declined" || r.status === "expired") {
      detail.innerHTML = `<button class="secondary-link" onclick="reorder('${r.id}')">用同規格重新詢價</button>`;
    }
  }

  async function decideQuote(requestId, quoteVersion, accept, btn) {
    const statusEl = document.getElementById(`decide-status-${requestId}`);
    btn.disabled = true;
    try {
      const resp = await apiFetch(`/api/b2b/purchase-requests/${requestId}/${accept ? "accept" : "decline"}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ quote_version: quoteVersion }),
      });
      if (resp.status === 409) {
        const body = await resp.json().catch(() => ({}));
        const messages = {
          quote_version_stale: "業務剛更新了這筆報價，請重新整理後再確認一次。",
          insufficient_supply: "供貨量剛好不夠了，請聯繫業務調整數量。",
          not_in_quoted_state: "這筆需求目前的狀態已經不是待確認報價。",
        };
        if (statusEl) { statusEl.textContent = messages[body.detail] || "確認失敗，請重新整理後再試。"; statusEl.className = "status error"; }
        btn.disabled = false;
        return;
      }
      if (resp.status === 410) {
        if (statusEl) { statusEl.textContent = "這筆報價已經逾期，請聯繫業務重新報價。"; statusEl.className = "status error"; }
        btn.disabled = false;
        return;
      }
      if (!resp.ok) throw new Error(String(resp.status));
      await loadMyRequests();
    } catch {
      if (statusEl) { statusEl.textContent = "送出失敗，請重試。"; statusEl.className = "status error"; }
      btn.disabled = false;
    }
  }

  async function loadRequestExtras(requestId) {
    const el = document.getElementById(`req-extras-${requestId}`);
    el.innerHTML = '<p class="empty-note">載入中…</p>';
    try {
      const [fulfillResp, followupResp] = await Promise.all([
        apiFetch(`/api/b2b/purchase-requests/${requestId}/fulfillment`),
        apiFetch(`/api/b2b/purchase-requests/${requestId}/followups`),
      ]);
      const fulfillment = fulfillResp.ok ? await fulfillResp.json() : { available: false };
      const followups = followupResp.ok ? await followupResp.json() : [];

      let fulfillHtml;
      if (!fulfillment.available) {
        const reasonText = {
          order_not_created_yet: "業務尚未建立正式訂單，交貨與付款狀態還看不到。",
          farm_not_linked: "這筆供貨還沒接上農場資料，無法顯示交貨進度。",
          sales_unreachable: "暫時無法取得交貨/付款資料，請稍後再試。",
          order_not_found_in_sales: "訂單資料暫時查不到，請聯繫業務確認。",
        }[fulfillment.reason] || "交貨/付款資料暫時看不到。";
        fulfillHtml = `<p class="meta">${reasonText}</p>`;
      } else {
        fulfillHtml = fulfillment.lines.map(line => `
          <div class="meta">${escapeHtml(line.product || "")}：已交寄 ${line.shipped_quantity ?? 0}／剩餘 ${line.remaining_quantity ?? 0}（${escapeHtml(line.status || "")}）</div>
        `).join("") + `<div class="meta">已收款 NT$${fulfillment.paid_total_twd}｜已退款 NT$${fulfillment.refunded_total_twd}</div>`;
      }

      const followupHtml = followups.length ? followups.map(f => `
        <div class="meta">[${{change_date:"改期",cancel_remaining:"取消",complaint:"客訴"}[f.followup_type] || f.followup_type}] ${escapeHtml(f.message)}｜${escapeHtml(f.status_label)}${f.resolution_note ? "：" + escapeHtml(f.resolution_note) : ""}</div>
      `).join("") : '<p class="empty-note">尚未提出改期/取消/客訴。</p>';

      el.innerHTML = `
        <div class="quote-box">
          <b style="font-size:12px;color:var(--muted)">交貨/付款狀態</b>
          ${fulfillHtml}
        </div>
        <div class="quote-box">
          <b style="font-size:12px;color:var(--muted)">改期／取消／客訴紀錄</b>
          ${followupHtml}
          <select id="followup-type-${requestId}" style="margin-top:8px">
            <option value="change_date">要求改期</option>
            <option value="cancel_remaining">取消未交貨量</option>
            <option value="complaint">回報收貨問題</option>
          </select>
          <textarea id="followup-msg-${requestId}" rows="2" placeholder="說明內容" style="width:100%;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:8px;box-sizing:border-box"></textarea>
          <button class="secondary-link" style="margin-top:6px" onclick="submitFollowup('${requestId}', this)">送出</button>
          <p class="status" id="followup-status-${requestId}"></p>
        </div>`;
    } catch {
      el.innerHTML = '<p class="empty-note">載入失敗，請重試。</p>';
    }
  }

  async function submitFollowup(requestId, btn) {
    const followupType = document.getElementById(`followup-type-${requestId}`).value;
    const message = document.getElementById(`followup-msg-${requestId}`).value.trim();
    const statusEl = document.getElementById(`followup-status-${requestId}`);
    if (!message) { statusEl.textContent = "請填寫說明內容。"; statusEl.className = "status error"; return; }
    btn.disabled = true;
    try {
      const resp = await apiFetch(`/api/b2b/purchase-requests/${requestId}/followups`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ followup_type: followupType, message }),
      });
      if (!resp.ok) throw new Error(String(resp.status));
      await loadRequestExtras(requestId);
    } catch {
      statusEl.textContent = "送出失敗，請重試。";
      statusEl.className = "status error";
      btn.disabled = false;
    }
  }

  async function reorder(requestId) {
    try {
      const resp = await apiFetch(`/api/b2b/purchase-requests/${requestId}/reorder-draft`);
      if (!resp.ok) throw new Error(String(resp.status));
      const draft = await resp.json();
      // B10要求：保留規格，但不沿用舊報價/舊可售量——重新走一次正常送出
      // 流程，業務要對著當期供貨重新報價。
      openRequestModal({ crop_name: draft.crop_name, unit: draft.unit, id: "", available_quantity: "請洽業務確認", is_reference_only: true }, draft);
    } catch {
      alert("載入上次規格失敗，請重試。");
    }
  }

  function closeRequestModal() { document.getElementById("requestModal").style.display = "none"; }

  function openRequestModal(offering, prefill) {
    const modal = document.getElementById("requestModal");
    const body = document.getElementById("requestModalBody");
    const isReorder = !offering.id;
    body.innerHTML = `
      <h3>${isReorder ? "用同規格重新詢價" : "送出採購需求"}：${escapeHtml(offering.crop_name)}</h3>
      <label>需求數量（${escapeHtml(offering.unit)}${isReorder ? "" : `，${offering.is_reference_only ? "供貨參考" : "尚餘"} ${offering.available_quantity}`}）</label>
      <input type="number" id="reqQty" min="0.1" step="0.1" value="${(prefill && prefill.requested_quantity) || 1}">
      <label>盼交貨日期</label>
      <input type="date" id="reqDate">
      <label>備註</label>
      <textarea id="reqNote" rows="2">${escapeHtml((prefill && prefill.note) || "")}</textarea>
      ${isReorder ? '<p class="meta">重新詢價不沿用舊價格，業務會依目前供貨重新報價。</p>' : ""}
      <p class="status" id="reqStatus"></p>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button id="reqCancelBtn" style="flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;">取消</button>
        <button id="reqSubmitBtn" class="primary" style="flex:1;margin-top:0;">送出</button>
      </div>
    `;
    modal.style.display = "flex";
    // 固定在開啟modal的這一刻產生，不是每次按「送出」都重算——如果第一次
    // 因為功能尚未上線(404)失敗，使用者原地重試用的是同一個idempotency_key，
    // 不會因為多按了幾次而變成兩筆不同的需求。
    const idempotencyKey = `b2b-${offering.id || "reorder"}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    document.getElementById("reqCancelBtn").addEventListener("click", closeRequestModal);
    document.getElementById("reqSubmitBtn").addEventListener("click", async () => {
      const qty = parseFloat(document.getElementById("reqQty").value);
      if (!(qty > 0)) { setStatus("reqStatus", "請輸入正確的數量。", "error"); return; }
      setStatus("reqStatus", "送出中…");
      let resp;
      try {
        resp = await apiFetch("/api/b2b/purchase-requests", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            idempotency_key: idempotencyKey, offering_id: offering.id || null, crop_name: offering.crop_name,
            requested_quantity: qty, unit: offering.unit,
            desired_date: document.getElementById("reqDate").value || null,
            note: document.getElementById("reqNote").value || null,
          }),
        });
      } catch {
        // 連線層的失敗(不是404)——表單內容本來就還留在畫面上，不用額外處理。
        setStatus("reqStatus", "送出失敗，請檢查網路後重試。您填寫的內容還保留著。", "error");
        return;
      }
      if (isNotDeployedYet(resp)) {
        // 故意不closeRequestModal()——數量/日期/備註都還留在輸入框裡，
        // 等功能上線後使用者可以直接在同一個畫面按「送出」，不用重填。
        setStatus("reqStatus", NOT_DEPLOYED_MESSAGE, "error");
        return;
      }
      if (!resp.ok) {
        setStatus("reqStatus", "送出失敗，請重試。您填寫的內容還保留著。", "error");
        return;
      }
      closeRequestModal();
      loadMyRequests();
    });
  }

  document.getElementById("logoutBtn").addEventListener("click", () => { setToken(""); location.reload(); });

  // 這幾個是動態產生的HTML裡用inline onclick叫的——inline onclick是在
  // global scope查找函式，這個IIFE裡定義的函式本來不會被看到，要手動掛到
  // window上才能被呼叫到。
  window.decideQuote = decideQuote;
  window.loadRequestExtras = loadRequestExtras;
  window.submitFollowup = submitFollowup;
  window.reorder = reorder;

  (async () => {
    const handledLineReturn = await handleLineReturn();
    if (handledLineReturn) return;
    if (getToken()) {
      showRestoring();
      afterLogin().catch(() => { setToken(""); showLoginCard("連線發生問題，請重新登入。"); });
    } else {
      showLoginCard();
    }
  })();
})();
</script>

</body>
</html>
